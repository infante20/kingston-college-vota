id: "6a8-10"
orden: 10
edad: "6-8"
tipo: arte
titulo: "Cardboard Puppets and a Puppet Show"
gancho: "Bring cardboard characters to life and put on your very own puppet show."
duracion: "30-45 min"
dif_prep: 2
dif_materiales: 1
materiales:
  - "Cardboard or poster board"
  - "Safety scissors"
  - "Craft sticks, pencils, or straws for the handles"
  - "Tempera paint or markers"
  - "Tape or glue"
  - "A large box or a table for the stage"
preparacion: >
  Decide together on a simple story and which characters you'll need: maybe a hero,
  an animal, and a villain. Cover the table for painting and cut the cardboard into
  manageable pieces.
pasos:
  - "Draw each character on the cardboard and cut out the shapes, with help if needed."
  - "Paint and decorate the characters with faces, clothes, and fun details."
  - "Tape a stick to the back of each figure so you can hold it up and move it around."
  - "Turn a tipped-over box or the edge of a table draped with fabric into the stage."
  - "Rehearse the story, giving each puppet its own voice."
  - "Perform the show for the rest of the family like a real theater."
aprendizaje: >
  Encourages creativity, language, and spoken expression. Making up and acting out a
  story develops imagination, narrative sequencing, and confidence speaking in front
  of others.
variantes: >
  Make shadow puppets by cutting out silhouettes and shining a flashlight behind a
  sheet, or record the show's audio to listen to later.
seguridad: >
  Have your child use safety scissors, and let an adult supervise the trickier cuts.
