id: "3a5-10"
orden: 10
edad: "3-5"
tipo: arte
titulo: "Potato and Veggie Stamps"
gancho: "Stamp shapes over and over with stamps made from potatoes, corks, and veggies."
duracion: "20-30 min"
dif_prep: 2
dif_materiales: 1
materiales:
  - "A potato, a carrot, or a piece of celery"
  - "Tempera paint or homemade paint (water, flour, and food coloring)"
  - "A plate for the paint"
  - "Sheets of paper"
  - "Knife (grown-up only)"
preparacion: >
  The grown-up cuts the potato in half and, if they like, carves a simple shape into the surface
  (a heart, a star). Pour a little paint onto the plate and lay out the sheets of paper.
pasos:
  - "Show them how to dip the stamp into the paint on the plate."
  - "Have them press the stamp onto the paper and lift it carefully to see the shape."
  - "Repeat with different stamps and colors to fill the page with prints."
  - "Encourage them to mix shapes and colors freely, without aiming for a perfect picture."
  - "Let the artwork dry and hang it where your little one can see it."
aprendizaje: >
  Builds fine motor skills and coordination through pressing and lifting. Stamping invites
  experimenting with patterns, colors, and rhythm, valuing free creation.
variantes: >
  Use corks, bottle caps, or textured pieces as stamps. Stamp a repeating pattern to decorate
  a card or homemade wrapping paper.
seguridad: >
  Only the grown-up cuts or carves the veggies with the knife. Use non-toxic paint and supervise
  so your little one doesn't put it in their mouth; protect the table and clothes.
