id: "6a8-22"
orden: 22
edad: "6-8"
tipo: arte
titulo: "Veggie Stamp Art"
gancho: "Turn a potato or a beet into a stamp and fill the paper with colorful shapes."
duracion: "30-45 min"
dif_prep: 2
dif_materiales: 2
materiales:
  - "A potato, a beet, or half a bell pepper"
  - "Tempera paint in several colors"
  - "A plate for the paint"
  - "Sheets of paper"
  - "A knife (for adult use only)"
  - "An apron or clothes that can get messy"
preparacion: >
  Cover the table and put on aprons. An adult cuts the potato in half and, if they
  like, carves a simple shape into the surface. Pour a little tempera paint of each
  color onto the plate.
pasos:
  - "Dip the flat side of the vegetable into the paint, without loading on too much."
  - "Press the vegetable onto the paper, pushing down gently to leave a print."
  - "Repeat with different colors and vegetables to create lots of shapes."
  - "Combine the stamps into borders, flowers, or a free-form design."
  - "Let the paper dry before hanging it up or giving it as a gift."
aprendizaje: >
  Sparks creativity and fine motor skills, and shows that nature's shapes can be used
  to make art. Your child experiments with textures, colors, and repeating patterns.
variantes: >
  Compare the prints each vegetable leaves, or use a cut beet to tint the paper with
  its natural juice, no paint needed.
seguridad: >
  Only an adult uses the knife. Don't eat the vegetables once they've been painted.
