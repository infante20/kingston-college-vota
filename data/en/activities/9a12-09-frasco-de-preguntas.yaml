id: "9a12-09"
orden: 9
edad: "9-12"
tipo: emocional
titulo: "The Big Conversations Jar"
gancho: "Questions for real talk, to discover what each person truly thinks and feels."
duracion: "45-60 min"
dif_prep: 1
dif_materiales: 1
materiales:
  - "A jar, mug, or box"
  - "Paper cut into strips"
  - "Ballpoint pens for everyone"
  - "A comfortable spot to sit in a circle"
preparacion: >
  Pick a moment with no rush and no screens, for example after dinner. Sit in a circle so
  everyone can see each other's faces.
pasos:
  - "Each person secretly writes three or four questions on the strips of paper. They can be funny, curious, or deep."
  - "Mix in some examples for inspiration: what moment are you proudest of? What would you change about the world? When did you feel brave? What would you like us to know about you?"
  - "Fold all the strips and drop them into the jar. Mix them well."
  - "Taking turns, each person draws a question and answers it honestly. Afterward, the others can answer too if they want."
  - "Agree on a golden rule: listen without interrupting and never judge an answer. Everything shared is respected."
  - "When you finish, talk about which question made you think the most and save the jar to do it again another day."
aprendizaje: >
  Develops emotional intelligence, active listening, and the ability to express complex
  ideas. Discussing and sharing feelings in a safe environment strengthens bonds and
  critical thinking.
variantes: >
  Create themed jars: one for memories, one for dilemmas to debate ("would you lie to help
  a friend?"), and one for future dreams. Invite grandparents or friends to join in.
