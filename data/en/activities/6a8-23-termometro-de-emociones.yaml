id: "6a8-23"
orden: 23
edad: "6-8"
tipo: emocional
titulo: "The Feelings Thermometer"
gancho: "Draw a special thermometer to measure how you're feeling and learn to cool down when it climbs too high."
duracion: "30-45 min"
dif_prep: 1
dif_materiales: 1
materiales:
  - "A large sheet of paper or poster board"
  - "Colored pencils"
  - "A marker"
  - "A clothespin or a cardboard arrow (optional)"
preparacion: >
  Find a quiet, comfortable spot to talk without rushing. Together, draw a tall, wide
  thermometer on the paper, with room for several levels of color.
pasos:
  - "Color the thermometer from bottom to top: green for calm, yellow for restless, and red for big anger."
  - "Talk about what the body feels at each color, like a racing heart or clenched hands."
  - "Ask your child to point with the clothespin or their finger to the color they're at today."
  - "Come up with an idea together for getting from red or yellow back down to green, like taking deep breaths or drinking water."
  - "Hang the thermometer in their room to use at other times of day."
aprendizaje: >
  Helps kids recognize and name emotions and notice how they feel in the body. Your
  child learns that getting angry is normal and that there are ways to come back to
  calm.
variantes: >
  Make a thermometer for the whole family, or add drawings of faces at each level for
  younger kids.
seguridad: >
  Keep the conversation calm and free of scolding; the goal is for your child to feel
  heard.
