id: "3a5-11"
orden: 11
edad: "3-5"
tipo: arte
titulo: "Leaf and Flower Collage"
gancho: "Glue leaves, petals, and twigs to create a picture full of nature's treasures."
duracion: "20-30 min"
dif_prep: 1
dif_materiales: 1
materiales:
  - "Leaves, flowers, twigs, and seeds collected outside"
  - "A piece of poster board or cardboard"
  - "A glue stick or white glue"
  - "Pencils or crayons"
preparacion: >
  Take a short walk in the park, the yard, or down the street and gather leaves, petals, and
  twigs you both like. Back home, clear the table and keep the glue within reach.
pasos:
  - "Empty the collected treasures onto the table and look at them together: colors, shapes, and smells."
  - "Let your little one choose where each piece goes on the board."
  - "Help them add glue and stick down the leaves and flowers one by one."
  - "Have them finish the picture with crayon drawings all around."
  - "Let the collage dry and make up a title for it together."
aprendizaje: >
  Connects your little one with nature and its shapes. Gathering, choosing, and gluing works
  fine motor skills, observation, and creativity while composing a work of their own.
variantes: >
  Make one collage per season, with each one's typical colors. Line up the leaves from smallest
  to largest before gluing them down.
seguridad: >
  Collect only things from the ground, without pulling up plants, and avoid anything with thorns
  or prickles. Wash hands after the walk and when you're done.
