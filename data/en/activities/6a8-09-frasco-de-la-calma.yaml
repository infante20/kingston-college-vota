id: "6a8-09"
orden: 9
edad: "6-8"
tipo: emocional
titulo: "The Calm-Down Jar"
gancho: "Create a glitter galaxy in a jar to help you settle down when you're upset."
duracion: "30-45 min"
dif_prep: 1
dif_materiales: 2
materiales:
  - "A clear jar or bottle with a tight-fitting lid"
  - "Warm water"
  - "Clear liquid glue or glitter glue"
  - "Fine glitter"
  - "Food coloring (optional)"
  - "Strong tape to seal the lid"
preparacion: >
  Gather the materials on a covered table. Talk with your child about big feelings
  first: explaining that we all get angry or nervous sometimes sets up the whole
  point of this activity.
pasos:
  - "Fill the jar three-quarters full with warm water."
  - "Add several spoonfuls of glue; the more glue, the more slowly the glitter will fall."
  - "Pour in the glitter and, if you like, a drop of food coloring, then close the jar tightly."
  - "An adult seals the lid with tape so it can't open or spill."
  - "Shake the jar and quietly watch the glitter swirl and slowly settle."
  - "Talk about how, just like the glitter, angry feelings settle down if we wait and breathe."
aprendizaje: >
  Helps kids recognize and manage intense emotions. Watching the glitter settle goes
  hand in hand with slow breathing and teaches that emotions, like the storm in the
  jar, pass with time.
variantes: >
  Make several jars with colors tied to different emotions, or use the jar as a
  gentle timer for a one-minute calm-down break.
seguridad: >
  An adult should seal the lid carefully. Use a plastic jar if there's a risk it
  could fall and break.
