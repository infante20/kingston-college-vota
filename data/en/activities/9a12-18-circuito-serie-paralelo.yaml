id: "9a12-18"
orden: 18
edad: "9-12"
tipo: experimento
titulo: "Series and Parallel Circuits"
gancho: "Build your own circuits and discover why some light bulbs shine brighter than others."
duracion: "45-60 min"
dif_prep: 2
dif_materiales: 2
materiales:
  - "Two or three small flashlight bulbs with sockets (or low-voltage LED bulbs)"
  - "A large battery or a 4.5V lantern battery"
  - "Wires with clips or copper wire"
  - "Electrical tape"
  - "A homemade switch (a paper clip and two tacks on cardboard) optional"
  - "Notebook and ballpoint pen for recording"
preparacion: >
  Prepare the wires by stripping the ends bare so they can make contact. If you use plain wire,
  an adult scrapes the ends. Gather the bulbs in their sockets and keep the battery handy.
pasos:
  - "Write your hypothesis: if you connect two bulbs in a row, will they shine the same, brighter, or dimmer than a single one?"
  - "Build a series circuit: connect the battery, one bulb, then the other, and back to the battery, all in a single line. Observe the brightness and note it down."
  - "Disconnect one bulb from the series circuit and watch what happens to the other. Record the result."
  - "Now build a parallel circuit: each bulb connected separately to the two terminals of the battery. Compare the brightness with the previous case."
  - "Disconnect one bulb from the parallel circuit and see if the other stays lit. Note the difference from the series circuit."
  - "Write your conclusion: explain in which circuit the bulbs shine brighter and in which one a bulb stays lit even if the other fails."
aprendizaje: >
  In a series circuit the current passes through all the bulbs in a row, so if one fails they
  all go out and they shine dimmer. In parallel each bulb has its own path, they shine brighter
  and work independently. That's why houses use parallel circuits.
variantes: >
  Add a homemade switch with a paper clip to turn the circuit on and off. Add a third bulb and
  predict how the brightness will change in each type of circuit before testing it.
seguridad: >
  Use only batteries, never a wall outlet. If the wires or battery get hot, disconnect them.
  An adult does the wire scraping.
