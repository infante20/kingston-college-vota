id: "6a8-20"
orden: 20
edad: "6-8"
tipo: naturaleza
titulo: "The Plant That Chases the Light"
gancho: "Grow a bean and watch its stem lean toward the window all on its own, searching for the sun."
duracion: "30-45 min"
dif_prep: 2
dif_materiales: 1
materiales:
  - "A dried bean or a fast-growing seed"
  - "A clear jar or glass"
  - "Cotton balls or paper napkins"
  - "Water"
  - "A spot near a window"
  - "A notebook for writing things down"
preparacion: >
  Dampen the cotton with water, without letting it drip, and place it inside the jar.
  Pick a spot next to a window that gets good light during the day. Have the notebook
  ready to keep a record.
pasos:
  - "Tuck the bean between the cotton and the glass of the jar so you can watch it grow."
  - "Set the jar near the window and keep the cotton moist at all times."
  - "Each day, observe and draw in the notebook how the root and stem appear."
  - "Once the stem has grown, turn the jar so the plant faces away from the light."
  - "Keep watching over the next few days as the stem leans back toward the window."
aprendizaje: >
  Shows phototropism: plants grow toward the light they need to live. Your child cares
  for a living thing, records its changes, and discovers that plants react to their
  surroundings.
variantes: >
  Put another bean inside a dark box with a single hole for light and compare which
  way it grows, or plant the bean in a pot with soil once it has roots.
seguridad: >
  Wash your hands after handling soil and damp cotton. Don't put the seeds in your
  mouth.
