id: "3a5-24"
orden: 24
edad: "3-5"
tipo: arte
titulo: "Bubble-Print Paintings"
gancho: "Blow colorful bubbles that pop on the paper and leave amazing pictures behind."
duracion: "20-30 min"
dif_prep: 2
dif_materiales: 2
materiales:
  - "One cup per color"
  - "Dish soap and a little water"
  - "Tempera paint in several colors"
  - "Straws (one per color)"
  - "Sheets of thick paper"
preparacion: >
  In each cup, mix a little water, a squirt of dish soap, and plenty of tempera paint in one
  color. Put a straw in each cup. Cover the table and put an apron on your little one.
pasos:
  - "Show them how to blow gently through the straw into the cup until lots of bubbles rise up."
  - "Remind them to blow, never suck, so they don't swallow the mixture."
  - "When the bubbles overflow the cup, press the paper on top so they pop onto the page."
  - "Repeat with other colors on different parts of the sheet."
  - "Let the painting dry and celebrate the round little prints left behind."
aprendizaje: >
  Encourages creativity and breath control through blowing. Watching the bubbles leave shapes
  on the paper sparks wonder and a love of making art.
variantes: >
  Mix two colors on the same sheet to discover new colors. Cut out the round shapes and put
  together a collage.
seguridad: >
  Your little one must blow, never sip, the dish soap mixture. Stay with them the whole time
  and wash hands when you're done.
