id: "9a12-03"
orden: 3
edad: "9-12"
tipo: juego
titulo: "Secret Code Messages"
gancho: "Invent your own cipher and send messages only your team can read."
duracion: "45-60 min"
dif_prep: 1
dif_materiales: 1
materiales:
  - "Paper and pencil"
  - "Ruler"
  - "Cardboard to build a cipher wheel (optional)"
  - "A brass fastener or thumbtack for the wheel (optional)"
  - "Scissors (if you make the wheel)"
preparacion: >
  Gather everyone who is going to play. Decide which team will send messages and which will
  decode them. Get paper and pencil ready for everyone.
pasos:
  - "Learn the Caesar cipher: write out the alphabet and, below it, another alphabet shifted by a fixed number of letters (for example, 3). A becomes D, B becomes E, and so on."
  - "Each member writes a short message and encrypts it letter by letter using that shift. Agree on the key number in secret."
  - "Swap the encrypted messages and try to crack them without knowing the key: test different shifts until the message makes sense."
  - "Now invent your own code: you can swap letters for symbols, numbers, or drawings. Create a key table that only your team knows."
  - "If you want, cut out two cardboard circles of different sizes with the alphabet around the edge and join them with a brass fastener so you can spin and encrypt faster."
  - "Set up a final challenge: hide an encrypted clue somewhere in the house that leads to a small treasure."
aprendizaje: >
  Introduces cryptography and logical thinking. Encrypting and decrypting builds reasoning,
  attention to detail, and the concepts of pattern and key, the foundation of modern
  computer security.
variantes: >
  Try encrypting by writing words backwards, or use a keyword that tells you how many
  positions to shift each letter. Time each other to see who decodes fastest.
seguridad: >
  If you build the cipher wheel, use the scissors carefully when cutting the cardboard.
