id: "3a5-25"
orden: 25
edad: "3-5"
tipo: experimento
titulo: "Magic Rainbow Milk"
gancho: "The colors shoot off and dance across the milk all on their own the moment you touch it with soap."
duracion: "20-30 min"
dif_prep: 2
dif_materiales: 2
materiales:
  - "A shallow bowl or white dish"
  - "Whole milk (whatever's in the fridge)"
  - "Food coloring in several colors"
  - "Dish soap in a separate little bowl"
  - "A straw or a cotton swab"
preparacion: >
  Take the milk out of the fridge and pour a layer that covers the bottom of the dish. Let it
  settle without moving it. Add a few drops of each food coloring to different spots on the
  milk. Keep the dish soap in a little bowl next to you and cover the table in case of spills.
pasos:
  - "Ask your little one to look at the little dots of color sitting still on the milk."
  - "Together, dip the tip of the straw or cotton swab into the dish soap."
  - "Touch the tip to the center of the milk, without stirring, and watch what happens."
  - "Watch the colors race toward the edges and swirl together in little whirlpools."
  - "Try touching other spots on the milk to create new bursts of color."
  - "Talk about which color they liked best and where it ran off to."
aprendizaje: >
  Introduces the idea that soap pushes the fat in the milk, which is why the colors move on
  their own. It builds observation, anticipating what will happen next, and movement vocabulary
  like push, escape, and spin.
variantes: >
  Try skim milk to compare whether the colors move the same or less. Press a white sheet of
  paper on top at the end to save a print of the swirled colors.
seguridad: >
  Milk with dish soap is not for drinking: it's just for watching. Stay with your little one the
  whole time and wash hands when you're done. Wipe up spills on the floor right away so it
  doesn't get slippery.
