  titulo: "Quality Time"
  subtitulo: "100+ screen-free activities and experiments for kids ages 0 to 12"
  autor: ""
  idioma: "en"
  anio: 2026
  editorial: "Independently published · Kindle Direct Publishing"
  slug: "Quality-Time"
  trim_width_in: 8.5
  trim_height_in: 11
  isbn: ""

# ---- Palette (same brand as Spanish edition) ----
palette:
  verde: "#2E7D5B"
  azul: "#3E6E94"
  coral: "#E8744F"
  ambar: "#F2A03D"
  crema: "#FBF7F0"
