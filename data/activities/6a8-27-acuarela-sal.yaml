id: 6a8-27
orden: 27
edad: 6-8
tipo: arte
titulo: Acuarela con sal
gancho: Pintar con acuarela y espolvorear sal para crear texturas mágicas y brillantes.
duracion: 25 min
dif_prep: 1
dif_materiales: 1
materiales:
- Acuarelas o témpera aguada
- Papel grueso
- Sal gruesa
- Pinceles y agua
preparacion: Protege la mesa y prepara los colores bien diluidos con agua.
pasos:
- Pinten el papel con acuarela bien mojada, sin dejar secar.
- Mientras está húmedo, espolvoreen sal sobre la pintura.
- Observen cómo la sal absorbe el agua y crea texturas estrelladas.
- Dejen secar por completo la obra.
- Sacudan la sal seca y descubran los efectos que quedaron.
aprendizaje: Muestra cómo la sal absorbe el agua y modifica la pintura, uniendo arte y ciencia. Experimentar
  con materiales desarrolla la creatividad y la observación.
variantes: Prueben con distintos tipos de sal o combinen varios colores que se mezclen al mojarse.
seguridad: Usen pinturas no tóxicas y protejan la ropa con un delantal.
