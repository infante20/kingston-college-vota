id: 6a8-31
orden: 31
edad: 6-8
tipo: emocional
titulo: El buzón familiar
gancho: Un buzón para dejarse mensajes cariñosos entre todos los de la casa.
duracion: 30 min + uso diario
dif_prep: 2
dif_materiales: 1
materiales:
- Una caja de cartón con una ranura
- Papel y lápices
- Material para decorar
preparacion: Decoren juntos la caja como un buzón y déjenla en un lugar común con papel al lado.
pasos:
- Expliquen que cualquiera puede dejar un mensaje para otro.
- Escriban notas de cariño, agradecimientos o cosas que quieran contar.
- Doblen el papel y métanlo por la ranura del buzón.
- Una vez por semana, abran el buzón y lean los mensajes juntos.
- Respondan los mensajes dejando nuevas notas.
aprendizaje: Fomenta la comunicación afectuosa y la expresión de emociones por escrito. Recibir mensajes
  de cariño fortalece la autoestima y los vínculos familiares.
variantes: Usen el buzón también para proponer planes o resolver pequeños desacuerdos con calma.
seguridad: 'Acuerden que es un espacio de respeto: solo mensajes amables y constructivos.'
