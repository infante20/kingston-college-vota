id: 0a2-31
orden: 31
edad: 0-2
tipo: emocional
titulo: Burrito en la manta
gancho: 'Envolverse en una manta y mecerse: contención y cariño en estado puro.'
duracion: 10 min
dif_prep: 1
dif_materiales: 1
materiales:
- Una manta suave y no muy gruesa
preparacion: Elige una manta liviana y un espacio tranquilo en el suelo o la cama.
pasos:
- Recuesta al bebé sobre el borde de la manta.
- Envuélvelo con suavidad dejando siempre la cara y la cabeza libres.
- Mécelo despacio de un lado a otro como un burrito.
- Canta o háblale con voz calmada mientras se mece.
- Destápalo con un «¡cucú!» y un abrazo final.
aprendizaje: La presión suave y el balanceo regulan el sistema nervioso y transmiten calma. Es un juego
  de contención que refuerza la confianza y el vínculo.
variantes: Haz rodar suavemente al «burrito» sobre la cama para que se desenvuelva solo.
seguridad: Deja siempre la cara y el cuello descubiertos, no aprietes y nunca lo dejes envuelto sin vigilancia.
