id: 6a8-13
orden: 13
edad: 6-8
tipo: experimento
titulo: Cristales de sal
gancho: Cultivar tus propios cristales y verlos crecer día a día como pequeñas joyas.
duracion: 20 min + varios días
dif_prep: 1
dif_materiales: 1
materiales:
- Agua caliente (la maneja un adulto)
- Sal o azúcar en abundancia
- Un frasco de vidrio
- Un hilo o un palito
- Un lápiz para cruzar sobre el frasco
preparacion: Un adulto prepara agua caliente y disuelve toda la sal posible, hasta que ya no se disuelva
  más.
pasos:
- Disuelvan sal en el agua caliente hasta saturarla.
- Aten un hilo a un lápiz y déjenlo colgando dentro del frasco sin tocar el fondo.
- Coloquen el frasco en un lugar tranquilo donde nadie lo mueva.
- Observen cada día cómo se forman cristales sobre el hilo.
- Anoten o dibujen el tamaño de los cristales día a día.
aprendizaje: Muestra cómo, al evaporarse el agua, la sal disuelta vuelve a formar cristales sólidos. Observar
  el cambio durante días enseña paciencia y método científico.
variantes: Comparen cristales de sal y de azúcar, o tiñan el agua para cristales de colores.
seguridad: Un adulto maneja el agua caliente; el resultado no se come.
