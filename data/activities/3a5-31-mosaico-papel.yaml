id: 3a5-31
orden: 31
edad: 3-5
tipo: arte
titulo: Mosaico de papel
gancho: Pegar trocitos de papel de colores para rellenar un dibujo como un mosaico.
duracion: 25 min
dif_prep: 2
dif_materiales: 1
materiales:
- Papeles de colores o revistas
- Pegamento en barra
- Una hoja con un dibujo de contorno simple
- Recipientes para clasificar
preparacion: Rasguen o recorten muchos trocitos de papel y sepárenlos por color en recipientes. Dibuja
  un contorno simple para rellenar.
pasos:
- 'Elijan un dibujo sencillo: una manzana, un pez, una estrella.'
- Pongan pegamento por zonas dentro del contorno.
- Peguen los trocitos de papel rellenando cada zona con un color.
- Vayan completando el dibujo como un mosaico de colores.
- Dejen secar y muestren la obra terminada.
aprendizaje: Afina la pinza de los dedos y la paciencia al pegar trocitos pequeños. Clasificar por color
  y rellenar zonas desarrolla el orden y la concentración.
variantes: Hagan el mosaico con trozos de cáscara de huevo pintada o con legumbres.
seguridad: Vigila los trocitos pequeños con los hermanos menores.
