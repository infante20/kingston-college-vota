id: 3a5-20
orden: 20
edad: 3-5
tipo: recreativa
titulo: La rayuela
gancho: Saltar de casilla en casilla en un clásico de siempre que nunca pasa de moda.
duracion: 20-30 min
dif_prep: 1
dif_materiales: 1
materiales:
- Tiza para el suelo o cinta de papel para interior
- Una piedra plana o un saquito
preparacion: Dibujen juntos la rayuela en el suelo con casillas numeradas del 1 al 10.
pasos:
- Repasen juntos los números de cada casilla en voz alta.
- El niño lanza la piedra a la casilla número uno.
- Salta las casillas a la pata coja, saltándose la que tiene la piedra.
- Al volver, recoge la piedra y avanza al número siguiente.
- Continúen turnándose hasta completar el recorrido.
aprendizaje: Desarrolla el equilibrio, la coordinación y el salto a la pata coja. Reconocer números y
  respetar turnos suma aprendizaje matemático y social.
variantes: Reemplacen los números por colores o por letras para variar el desafío.
seguridad: Jueguen en una superficie plana y sin obstáculos para evitar caídas.
