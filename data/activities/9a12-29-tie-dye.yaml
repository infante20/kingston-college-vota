id: 9a12-29
orden: 29
edad: 9-12
tipo: arte
titulo: Teñido de polera
gancho: Anudar, teñir y descubrir un diseño único e irrepetible en tu propia ropa.
duracion: 40 min + secado
dif_prep: 2
dif_materiales: 2
materiales:
- Una polera o tela blanca de algodón
- Tintura para ropa o témpera diluida
- Gomas elásticas
- Guantes
- Un recipiente y plástico para proteger
preparacion: Protejan bien la mesa y pónganse guantes. Preparen los colores en recipientes.
pasos:
- Anuden la tela con gomas en espiral, nudos o pliegues.
- Apliquen los colores sobre las distintas zonas anudadas.
- Dejen reposar el tiempo que indique la tintura.
- Enjuaguen, quiten las gomas y descubran el diseño.
- Dejen secar y planchen con ayuda para fijar el color.
aprendizaje: Explora la mezcla de colores y cómo los pliegues crean patrones inesperados. Diseñar algo
  propio fomenta la creatividad y la identidad.
variantes: Prueben distintas técnicas de anudado y comparen los patrones que resultan.
seguridad: Usen guantes y un adulto maneja la tintura y la plancha.
