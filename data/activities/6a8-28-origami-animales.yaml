id: 6a8-28
orden: 28
edad: 6-8
tipo: arte
titulo: Origami de animales
gancho: Doblar papel hasta que aparezca un perro, una rana o un pájaro.
duracion: 30 min
dif_prep: 1
dif_materiales: 1
materiales:
- Hojas de papel cuadradas
- Plumones para los detalles
- Una guía de dobleces (opcional)
preparacion: Recorten hojas cuadradas y elijan una figura sencilla para empezar, como la cara de un perro.
pasos:
- Sigan paso a paso los dobleces de la figura elegida.
- Marquen bien cada pliegue pasando la uña por el borde.
- Ayúdense entre todos cuando un paso sea más difícil.
- Dibujen ojos, hocico y detalles al terminar.
- Armen una colección de animales y jueguen con ellos.
aprendizaje: Desarrolla la motricidad fina, la atención a las instrucciones y la noción espacial. Seguir
  una secuencia de pasos entrena la concentración y la paciencia.
variantes: Hagan un móvil colgando varios animales o inventen una historia con ellos.
seguridad: Actividad muy segura; cuiden solo de no frustrarse y pedir ayuda cuando haga falta.
