orden: 35
edad: 6-8
tipo: naturaleza
titulo: Hotel de insectos
gancho: Un refugio hecho con palitos y piñas para invitar a los bichos del jardín.
duracion: 40 min + observación
dif_prep: 2
dif_materiales: 1
materiales:
- Una caja o envase abierto
- Ramitas, piñas, hojas secas y tubos de cartón
- Cuerda para colgar
preparacion: Reúnan materiales naturales secos y una caja que sirva de estructura.
pasos:
- Rellenen la caja con haces de ramitas, piñas y tubos de cartón.
- Dejen huecos de distintos tamaños donde puedan refugiarse los insectos.
- Coloquen o cuelguen el hotel en un rincón tranquilo del jardín.
- Observen con paciencia qué bichos llegan a vivir o esconderse.
- Anoten o dibujen los visitantes que vayan descubriendo.
aprendizaje: Enseña la importancia de los insectos en la naturaleza y fomenta su cuidado. Observar la
  vida del jardín desarrolla el respeto por los seres vivos.
variantes: Investiguen qué insecto vive en cada tipo de hueco y por qué.
seguridad: Observen sin tocar los insectos y lávense las manos después de manipular materiales.
