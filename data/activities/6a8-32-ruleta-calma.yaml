id: 6a8-32
orden: 32
edad: 6-8
tipo: emocional
titulo: La ruleta de la calma
gancho: Una ruleta con estrategias para calmarse cuando las emociones se desbordan.
duracion: 30 min
dif_prep: 2
dif_materiales: 1
materiales:
- Cartulina
- Un broche o lápiz como eje
- Plumones
- Tijeras
preparacion: Dibujen un círculo dividido en porciones y conversen sobre qué ayuda a calmarse.
pasos:
- 'Escriban o dibujen una estrategia en cada porción: respirar, contar hasta diez, abrazar, beber agua,
  saltar.'
- Coloquen una flecha giratoria en el centro con un broche.
- Cuando alguien se sienta enojado o nervioso, giren la ruleta.
- Practiquen juntos la estrategia que salió.
- Usen la ruleta cada vez que haga falta recuperar la calma.
aprendizaje: Entrega herramientas concretas para autorregular las emociones intensas. Practicar la calma
  en momentos tranquilos facilita usarla cuando de verdad se necesita.
variantes: Adapten las estrategias a lo que mejor le funcione a cada niño.
seguridad: 'Validen siempre la emoción antes de calmarla: sentir rabia o miedo es normal.'
