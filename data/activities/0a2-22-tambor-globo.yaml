orden: 22
edad: 0-2
tipo: recreativa
titulo: Tambor de globo
gancho: Un tarro y un globo se convierten en un tambor que vibra al tocarlo.
duracion: 10 min
dif_prep: 2
dif_materiales: 1
materiales:
- Un tarro o lata limpia de boca ancha
- Un globo grande
- Una tijera y cinta
preparacion: Corta el cuello del globo y estira la parte ancha sobre la boca del tarro como una membrana
  tensa. Asegúrala con cinta alrededor.
pasos:
- Muéstrale el tambor y dale un golpecito con la mano.
- Deja que el bebé golpee la membrana y sienta cómo vibra.
- Marca un ritmo simple y anímalo a imitarte.
- Pongan un poco de arroz encima y vean cómo salta al golpear.
- Canten una canción usando el tambor para llevar el compás.
aprendizaje: Desarrolla el ritmo, la coordinación y la relación causa-efecto entre golpe y sonido. Ver
  saltar el arroz introduce de forma lúdica la idea de vibración.
variantes: Usa tarros de distintos tamaños para descubrir que cada tambor suena más grave o más agudo.
seguridad: Revisa que el borde del tarro no tenga filo y supervisa por si la membrana se rompe.
