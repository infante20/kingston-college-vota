id: 9a12-19
orden: 19
edad: 9-12
tipo: recreativa
titulo: Catapulta de palitos
gancho: Una catapulta casera para lanzar pompones lo más lejos posible.
duracion: 30 min
dif_prep: 2
dif_materiales: 2
materiales:
- Palitos de helado
- Gomas elásticas
- Una tapa de botella o cuchara pequeña
- Pompones o bolitas de papel
preparacion: Reúne los palitos y las gomas. Decidan juntos el diseño básico de la catapulta.
pasos:
- Apilen varios palitos y átenlos con gomas en los extremos.
- Crucen dos palitos en forma de palanca y únanlos con goma.
- Peguen una tapa al extremo del brazo como cuchara.
- Coloquen un pompón y presionen el brazo para lanzarlo.
- Midan los lanzamientos y ajusten la catapulta para llegar más lejos.
aprendizaje: Demuestra cómo una palanca almacena y libera energía para lanzar. Ajustar el diseño para
  mejorar el alcance desarrolla la lógica y la perseverancia.
variantes: Marquen una diana con puntajes y compitan por puntería en vez de distancia.
seguridad: Lancen solo objetos blandos y nunca apunten a las personas ni a la cara.
