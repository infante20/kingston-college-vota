id: 0a2-26
orden: 26
edad: 0-2
tipo: juego
titulo: Caja de pañuelos sorpresa
gancho: Tirar de un pañuelo y descubrir que aparece otro, y otro, y otro más.
duracion: 10 min
dif_prep: 2
dif_materiales: 1
materiales:
- Una caja de pañuelos vacía o un envase con tapa con ranura
- Pañuelos de tela o telas livianas anudadas entre sí
preparacion: Mete las telas dentro de la caja por la ranura, dejando una punta asomada. Puedes anudarlas
  entre sí para una cadena continua.
pasos:
- Muéstrale la punta de tela que asoma y tira un poco para mostrarle la idea.
- Anímalo a tirar él de la tela y a sacarla.
- Celebra su sorpresa cuando aparece otra detrás.
- Cuando vacíe la caja, vuelvan a meter las telas juntos.
- Nombra los colores de cada tela a medida que salen.
aprendizaje: Afina la pinza de los dedos y la fuerza de las manos al tirar. Volver a llenar la caja desarrolla
  la motricidad fina y la paciencia.
variantes: Usa telas de distintas texturas y colores para sumar estímulo sensorial.
seguridad: Usa telas en lugar de pañuelos de papel y evita cordones largos alrededor del cuello.
