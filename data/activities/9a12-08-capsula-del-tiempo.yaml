id: "9a12-08"
orden: 8
edad: "9-12"
tipo: emocional
titulo: "Cápsula del tiempo"
gancho: "Guarda un mensaje para tu yo del futuro y ábrelo dentro de un año."
duracion: "45-60 min"
dif_prep: 1
dif_materiales: 1
materiales:
  - "Una caja con tapa o un frasco de vidrio con cierre hermético"
  - "Papel y lápiz pasta"
  - "Fotos impresas, dibujos o pequeños objetos con significado"
  - "Cinta adhesiva y un plumón"
preparacion: >
  Busca un recipiente que cierre bien y un rincón tranquilo para escribir sin apuro. Decide
  en familia cuándo abrirán la cápsula: dentro de seis meses, un año o más.
pasos:
  - "Escribe una carta a tu yo del futuro. Cuenta cómo eres ahora: lo que te gusta, tus amigos, tus miedos y lo que sueñas conseguir."
  - "Responde a algunas preguntas para comparar luego: ¿cuál es tu canción favorita?, ¿qué quieres ser cuando grande?, ¿qué te hace feliz hoy?"
  - "Reúne objetos que representen este momento de tu vida: una foto, una entrada, un dibujo o una lista de tus series y libros favoritos."
  - "Si lo hacen en familia, cada persona prepara su propia carta y un objeto compartido que represente al grupo."
  - "Guarden todo en la caja, ciérrenla bien y escriban por fuera la fecha en que está prohibido abrirla."
  - "Escondan la cápsula en un lugar seguro y anoten en un calendario el día de la apertura."
aprendizaje: >
  Favorece la introspección, la expresión emocional y la conciencia del paso del tiempo.
  Comparar quién eras con quién serás ayuda a valorar tu propio crecimiento y a reflexionar
  sobre lo que de verdad importa.
variantes: >
  Conviértanla en una tradición anual: cada año una cápsula nueva. O escriban cartas cruzadas,
  una para cada miembro de la familia, que se leerán juntos el día de la apertura.
