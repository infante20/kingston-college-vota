id: 6a8-29
orden: 29
edad: 6-8
tipo: arte
titulo: Piedras pintadas
gancho: Transformar piedras lisas en mariquitas, monstruos o mensajes de colores.
duracion: 30 min + secado
dif_prep: 1
dif_materiales: 1
materiales:
- Piedras lisas y limpias
- Témpera o pintura acrílica
- Pinceles finos
- Barniz o cola transparente (opcional)
preparacion: Laven y sequen las piedras. Protejan la mesa con papel de diario.
pasos:
- Observen la forma de cada piedra e imaginen en qué puede convertirse.
- Pinten primero un fondo de color y déjenlo secar.
- 'Agreguen los detalles con pincel fino: ojos, puntos, dibujos.'
- Dejen secar bien la pintura.
- Si quieren, sellen con una capa de barniz para protegerlas.
aprendizaje: Estimula la creatividad y la observación al ver figuras en las formas naturales. Pintar detalles
  finos afina la motricidad y la concentración.
variantes: Escondan las piedras pintadas en una plaza para que otros las encuentren.
seguridad: Usen pinturas no tóxicas y un adulto supervisa si usan barniz.
