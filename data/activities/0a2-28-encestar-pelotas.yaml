id: 0a2-28
orden: 28
edad: 0-2
tipo: juego
titulo: A encestar
gancho: 'Lanzar pelotas blandas dentro de una caja: puntería y risas garantizadas.'
duracion: 10-15 min
dif_prep: 1
dif_materiales: 1
materiales:
- Una caja o canasta grande
- Pelotas blandas, calcetines enrollados o pompones grandes
- Un espacio despejado
preparacion: Coloca la caja en el suelo y reúne las pelotas blandas en un montón cerca.
pasos:
- Siéntate con el bebé frente a la caja, bien cerca.
- 'Muéstrale cómo dejas caer una pelota dentro: «¡adentro!».'
- Dale una pelota y anímalo a meterla o lanzarla a la caja.
- Celebra cada acierto con aplausos y palabras.
- Aleja la caja poco a poco para hacerlo un poquito más difícil.
aprendizaje: Mejora la puntería, la coordinación ojo-mano y el control de la fuerza al lanzar. Apuntar
  a un objetivo desarrolla la concentración.
variantes: Usen una canasta más alta o cuelguen un aro para encestar de pie.
seguridad: Usa solo objetos blandos y livianos para lanzar y juega lejos de objetos frágiles.
