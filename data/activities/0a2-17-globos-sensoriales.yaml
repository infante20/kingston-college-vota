id: 0a2-17
orden: 17
edad: 0-2
tipo: sensorial
titulo: Globos para apretar
gancho: Globos rellenos de distintos materiales para amasar y descubrir con las manos.
duracion: 10 min
dif_prep: 2
dif_materiales: 1
materiales:
- Globos resistentes
- Rellenos variados (harina, arroz, lentejas, un poco de agua)
- Un embudo o una botella cortada
preparacion: Rellena cada globo con un material distinto usando el embudo y haz un buen nudo. Pasa cinta
  sobre el nudo para reforzarlo. Prepara tres o cuatro globos.
pasos:
- Ofrece al bebé un globo y deja que lo tome y lo apriete.
- Guía sus manos para que sienta lo blando, lo duro o lo que cruje.
- Ve cambiando de globo y nombra las sensaciones.
- Aprieta tú uno y deja que vea cómo cambia de forma.
- Junta todos en una canasta para que elija el que más le guste.
aprendizaje: Fortalece la musculatura de las manos y afina el tacto al comparar texturas y pesos. Manipular
  distintos rellenos desarrolla la coordinación y la concentración.
variantes: Haz dos globos iguales y juega a que encuentre la pareja por el tacto.
seguridad: 'Supervisión constante: los globos son peligro de asfixia. Refuerza muy bien los nudos y retíralos
  si se ven dañados.'
