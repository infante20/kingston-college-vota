id: 6a8-30
orden: 30
edad: 6-8
tipo: emocional
titulo: Diario de gratitud
gancho: Un cuaderno para anotar cada día tres cosas buenas y entrenar la mirada positiva.
duracion: 10 min al día
dif_prep: 1
dif_materiales: 1
materiales:
- Un cuaderno o libreta
- Lápices de colores
- Stickers para decorar (opcional)
preparacion: Decoren juntos la portada del cuaderno y elijan un momento fijo del día, como antes de dormir.
pasos:
- Cada día, piensen en tres cosas buenas que les pasaron.
- Escríbanlas o dibújenlas en el cuaderno.
- Conversen sobre por qué los hicieron sentir bien.
- Lean de vez en cuando las páginas anteriores.
- Mantengan el hábito como un ritual de fin del día.
aprendizaje: Cultiva la gratitud y el optimismo, hábitos que protegen el bienestar emocional. Escribir
  sobre lo bueno ayuda a procesar el día y a dormir mejor.
variantes: Hagan un diario de gratitud familiar donde cada uno aporte su frase del día.
seguridad: 'No corrijan la ortografía ni juzguen lo que escriben: el espacio es libre y seguro.'
