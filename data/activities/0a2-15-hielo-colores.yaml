id: 0a2-15
orden: 15
edad: 0-2
tipo: sensorial
titulo: Cubos de hielo de colores
gancho: 'Frío, brillante y de colores: el hielo es pura magia sensorial.'
duracion: 10-15 min
dif_prep: 2
dif_materiales: 1
materiales:
- Cubeta de hielo
- Agua con unas gotas de colorante de alimentos
- Una bandeja con borde
- Una toalla
preparacion: La noche anterior, congela agua con colorante en la cubetera. Antes de empezar, prepara la
  bandeja sobre una toalla en un lugar fácil de limpiar.
pasos:
- Pon uno o dos cubos de hielo de colores en la bandeja.
- Toca tú un cubo y di «¡qué frío!» para mostrarle la sensación.
- Deja que el bebé los toque, empuje y vea cómo resbalan y se derriten.
- Nombra los colores y observa cómo el hielo deja un rastro de color al moverse.
- Cuando termine, sécale bien las manos para que entre en calor.
aprendizaje: Introduce las nociones de frío, derretir y color a través de la experiencia directa. El asombro
  ante el cambio del hielo alimenta la curiosidad científica temprana.
variantes: Congela un juguetito pequeño dentro del hielo y descubran juntos cómo aparece al derretirse
  (con supervisión).
seguridad: Ofrece el hielo por ratos cortos para no enfriar demasiado las manos y vigila que no lo lleve
  a la boca.
