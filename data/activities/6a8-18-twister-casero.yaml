id: 6a8-18
orden: 18
edad: 6-8
tipo: recreativa
titulo: Twister casero
gancho: 'Manos y pies a los colores: a enredarse sin caer en este clásico hecho en casa.'
duracion: 20-30 min
dif_prep: 2
dif_materiales: 1
materiales:
- Una sábana vieja o plástico grande
- Témpera o cartulinas de colores para hacer círculos
- Un dado o ruleta de colores y partes del cuerpo
preparacion: Pinta o pega filas de círculos de cuatro colores sobre la sábana. Prepara una ruleta que
  combine un color y una parte del cuerpo.
pasos:
- Extiendan la sábana en el suelo y dejen la ruleta a un lado.
- 'Por turnos, giren la ruleta: «mano derecha, azul».'
- Cada jugador pone esa parte del cuerpo en un círculo de ese color.
- 'Sigan girando: las posturas se vuelven cada vez más enredadas.'
- Pierde quien se cae o apoya una rodilla; el último en pie gana.
aprendizaje: Desarrolla el equilibrio, la flexibilidad y el conocimiento de izquierda y derecha. Seguir
  instrucciones y reírse juntos fortalece la convivencia.
variantes: Agreguen instrucciones divertidas como «codo» o «oreja» para complicar el juego.
seguridad: Jueguen sobre una superficie que no resbale y respeten los límites del cuerpo de cada uno.
