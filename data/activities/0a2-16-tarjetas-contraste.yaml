id: 0a2-16
orden: 16
edad: 0-2
tipo: sensorial
titulo: Tarjetas de alto contraste
gancho: 'Para los más pequeñitos: dibujos en blanco y negro que atrapan su mirada.'
duracion: 5-10 min
dif_prep: 2
dif_materiales: 1
materiales:
- Cartulinas blancas
- Plumón negro grueso
- Plástico para forrar o fundas (opcional)
preparacion: 'Dibuja figuras simples y grandes en negro sobre fondo blanco: espirales, rayas, círculos,
  una cara sencilla. Una figura por tarjeta.'
pasos:
- Recuesta al bebé boca arriba o sostenlo en tus brazos.
- Acerca una tarjeta a unos 25-30 cm de su cara.
- Muévela muy despacio de un lado a otro y observa cómo la sigue con la mirada.
- Cambia de tarjeta cuando notes que pierde interés.
- 'Habla con él suavemente mientras mira: «¿ves las rayas?».'
aprendizaje: Estimula la visión, que en los primeros meses distingue mejor los fuertes contrastes. Seguir
  la tarjeta con los ojos ejercita el control de la mirada y la atención.
variantes: A medida que crece, usa tarjetas con dos colores muy contrastados o con caras de distintas
  emociones.
seguridad: 'No fuerces su atención: si gira la cara o se inquieta, está pidiendo un descanso.'
