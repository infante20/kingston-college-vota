id: 0a2-29
orden: 29
edad: 0-2
tipo: emocional
titulo: Canciones con gestos
gancho: Cinco lobitos, las palmas palmitas… canciones de toda la vida para reír juntos.
duracion: 10 min
dif_prep: 1
dif_materiales: 1
materiales:
- Solo tus manos y tu voz
preparacion: Recuerda dos o tres canciones de gestos sencillas. Busca un momento tranquilo y cercano.
pasos:
- Sienta al bebé frente a ti o sobre tus piernas.
- Canta una canción haciendo los gestos despacio y exagerados.
- Repite la misma canción varias veces para que la anticipe.
- Haz una pausa antes del gesto final y observa cómo se emociona.
- Toma sus manitos y guíalas para que haga los gestos contigo.
aprendizaje: Fortalece el vínculo afectivo y el lenguaje a través del ritmo y la repetición. Anticipar
  los gestos desarrolla la memoria y la atención compartida.
variantes: Inventa gestos nuevos para sus canciones favoritas o cámbiale el nombre del personaje por el
  suyo.
seguridad: 'Adapta la intensidad a su ánimo: si se sobreexcita, baja el ritmo y la voz.'
