id: 0a2-18
orden: 18
edad: 0-2
tipo: recreativa
titulo: Atrapa la pelota
gancho: Una pelota que rueda es una invitación irresistible a gatear y moverse.
duracion: 15 min
dif_prep: 1
dif_materiales: 1
materiales:
- Una pelota liviana, blanda o de tela
- Un espacio despejado y seguro
preparacion: Despeja una zona del suelo de objetos duros o peligrosos. Si el piso es duro, pon una manta.
pasos:
- Siéntate en el suelo frente al bebé, a poca distancia.
- Hazle rodar la pelota despacio hacia sus manos.
- Anímalo a empujarla o lanzarla de vuelta hacia ti.
- Aléjala un poco para que gatee o camine a buscarla.
- 'Celebra cada vez que la alcanza: «¡la atrapaste!».'
aprendizaje: Favorece el gateo, la marcha y la coordinación entre ojos y manos. Pasarse la pelota por
  turnos siembra las primeras nociones de juego compartido.
variantes: Usa una pelota con cascabel dentro o hazla rodar dentro de un túnel de cojines.
seguridad: Elige una pelota blanda y grande, que no quepa en la boca, y juega en una zona sin esquinas
  duras.
