id: 0a2-25
orden: 25
edad: 0-2
tipo: juego
titulo: Tubo lanza-pelotas
gancho: Dejar caer una pelota por un tubo y verla aparecer por el otro lado.
duracion: 10-15 min
dif_prep: 2
dif_materiales: 1
materiales:
- Un tubo de cartón (de papel de cocina o de regalo)
- Pelotas pequeñas blandas o pompones grandes
- Cinta para fijar el tubo
preparacion: Fija el tubo en diagonal sobre una pared, un mueble o una caja, con la salida apuntando a
  un recipiente.
pasos:
- Muéstrale cómo metes una pelota por la parte de arriba del tubo.
- Observen juntos cómo aparece y cae por abajo.
- Dale una pelota para que la introduzca él mismo.
- Pon un recipiente en la salida para que las pelotas «aterricen» ahí.
- Cuenten las pelotas mientras las van metiendo, una a una.
aprendizaje: Trabaja la coordinación ojo-mano y la relación causa-efecto al anticipar dónde saldrá la
  pelota. Meter objetos por una ranura afina la motricidad fina.
variantes: Inclina el tubo más o menos para que las pelotas salgan más rápido o más lento.
seguridad: Usa pelotas grandes que no quepan enteras en la boca y supervisa el juego.
