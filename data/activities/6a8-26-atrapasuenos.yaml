id: 6a8-26
orden: 26
edad: 6-8
tipo: arte
titulo: Atrapasueños
gancho: Un aro con hilos y plumas para colgar sobre la cama y atrapar los buenos sueños.
duracion: 40 min
dif_prep: 2
dif_materiales: 2
materiales:
- Un aro (plato de cartón con el centro recortado)
- Lana o hilo
- Cuentas, plumas y cintas
- Pegamento
preparacion: Prepara el aro y reúne la lana, las cuentas y las plumas para decorar.
pasos:
- Aten un extremo de la lana al aro y crucen el centro formando una telaraña.
- Vayan pasando la lana de un punto a otro, ensartando alguna cuenta.
- Aten cintas y plumas colgando de la parte de abajo del aro.
- Hagan un lazo arriba para poder colgarlo.
- Cuélguenlo cerca de la cama y conversen sobre los sueños.
aprendizaje: Combina motricidad fina, paciencia y creatividad al tejer y decorar. Conocer una tradición
  distinta enriquece la mirada cultural.
variantes: Usen colores según el estado de ánimo o sumen pequeños dibujos colgantes.
seguridad: Un adulto ayuda a recortar el centro del aro y supervisa el uso de pegamento.
