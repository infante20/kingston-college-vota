id: "9a12-06"
orden: 6
edad: "9-12"
tipo: recreativa
titulo: "Circuito de retos y equilibrio"
gancho: "Convierte el patio o el pasillo en una pista de obstáculos que pone a prueba tu cuerpo."
duracion: "45-60 min"
dif_prep: 2
dif_materiales: 1
materiales:
  - "Cuerda o cinta adhesiva de papel para marcar líneas"
  - "Cojines, sillas o cajas como obstáculos"
  - "Botellas o latas para esquivar"
  - "Un cronómetro o reloj"
  - "Papel y lápiz para anotar tiempos"
preparacion: >
  Elige un espacio amplio y despejado, dentro o fuera de casa. Retira objetos frágiles del
  recorrido. Decide cuántas estaciones tendrá el circuito.
pasos:
  - "Diseñen juntos el recorrido con varias estaciones: una línea de equilibrio con la cuerda, un zigzag entre botellas, un salto sobre cojines y un tramo en un pie."
  - "Marquen el inicio y la meta. Prueben el circuito una vez despacio para comprobar que es seguro y posible."
  - "Cronometren el primer intento de cada participante y anoten el tiempo."
  - "Repitan varias rondas intentando mejorar su propia marca. Comenten qué estación cuesta más y por qué."
  - "Agreguen un reto extra: hacer el recorrido llevando un objeto en equilibrio sobre la mano o la cabeza."
  - "Al final, rediseñen una estación entre todos para hacerla más difícil y vuelvan a intentarlo."
aprendizaje: >
  Mejora la coordinación, el equilibrio y la planificación motriz. Superar la propia marca
  enseña perseverancia y autosuperación, y diseñar el circuito fomenta la creatividad y el
  trabajo en equipo.
variantes: >
  Conviértanlo en relevos por equipos, o agreguen pruebas mentales entre estaciones (una
  pregunta o un cálculo) para combinar cuerpo y mente.
seguridad: >
  Despeja el recorrido de muebles con esquinas y objetos que puedan resbalar. Usa calzado
  con buena suela y supervisa los saltos para evitar caídas.
