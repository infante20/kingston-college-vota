id: 0a2-20
orden: 20
edad: 0-2
tipo: recreativa
titulo: Baile de pañuelos
gancho: Telas que vuelan y caen despacio al ritmo de la música.
duracion: 10-15 min
dif_prep: 1
dif_materiales: 1
materiales:
- Pañuelos o telas finas y livianas
- Música suave o alegre
preparacion: Elige un par de pañuelos livianos y despeja un espacio para moverse. Pon música.
pasos:
- Toma un pañuelo y muévelo en el aire frente al bebé.
- Déjalo caer despacio y di «¡cae!» mientras flota hacia el suelo.
- Dale un pañuelo para que lo agite, lo lance y lo recoja.
- Bailen juntos moviendo las telas arriba y abajo con la música.
- Termina escondiendo tu cara tras el pañuelo para un «cucú» final.
aprendizaje: Estimula el movimiento, el equilibrio y la expresión a través del cuerpo y la música. Seguir
  el vuelo de la tela ejercita la mirada y la coordinación.
variantes: 'Cambien el ritmo de la música: rápido para agitar fuerte, lento para mecerse despacio.'
seguridad: Usa pañuelos pequeños y nunca cubras con ellos la cara del bebé por más de un instante.
