id: "9a12-10"
orden: 10
edad: "9-12"
tipo: arte
titulo: "Crea tu propio cómic"
gancho: "Inventa una historia con viñetas, bocadillos y un héroe a tu medida."
duracion: "45-60 min"
dif_prep: 1
dif_materiales: 1
materiales:
  - "Hojas de papel"
  - "Regla y lápiz"
  - "Goma de borrar"
  - "Rotuladores o lápices de colores"
  - "Bolígrafo negro para repasar"
preparacion: >
  Reúne el material en una mesa con buena luz. Piensa antes en una idea sencilla: un
  personaje, un problema que debe resolver y un final.
pasos:
  - "Define a tu protagonista: cómo es, qué quiere y cuál es su mayor reto. Dibuja varias caras hasta dar con su expresión."
  - "Escribe el guion en pocas frases dividido en principio, nudo y desenlace. Decide cuántas viñetas necesitas para contarlo."
  - "Con la regla, dibuja las viñetas en la hoja. Varía su tamaño: las escenas importantes pueden ocupar una viñeta más grande."
  - "Boceta a lápiz cada escena y añade los bocadillos de diálogo y los cuadros de texto. Comprueba que se entiende el orden de lectura."
  - "Repasa los trazos definitivos con el bolígrafo negro, borra el lápiz y colorea. Añade onomatopeyas como «¡BUM!» o «¡ZAS!» para dar fuerza."
  - "Ponle título y portada. Léelo a tu familia y pídeles su opinión para mejorar la próxima historia."
aprendizaje: >
  Une narrativa visual, escritura y dibujo. Estructurar una historia en viñetas entrena la
  síntesis, la secuencia temporal y la creatividad, y comunicar con imagen y texto a la vez
  desarrolla el lenguaje visual.
variantes: >
  Cread un cómic colaborativo en el que cada persona dibuja una viñeta sin ver del todo la
  anterior. O convertid en cómic una anécdota real de vuestra familia.
seguridad: >
  Si recortas las hojas para encuadernar el cómic, usa las tijeras con cuidado.
