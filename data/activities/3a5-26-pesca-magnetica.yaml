id: 3a5-26
orden: 26
edad: 3-5
tipo: juego
titulo: Pesca magnética
gancho: 'Una caña con imán para pescar pececitos de papel: paciencia y puntería.'
duracion: 20 min
dif_prep: 2
dif_materiales: 2
materiales:
- Cartulina para los peces
- Clips metálicos
- Un palito o lápiz
- Hilo
- Un imán
preparacion: Recorten pececitos, póngale un clip a cada uno y aten un imán al extremo de un hilo en el
  palito como caña.
pasos:
- Esparzan los peces por el suelo o dentro de una caja-estanque.
- Muéstrale cómo acercar el imán al clip para «pescar».
- Que intente levantar un pez con la caña y soltarlo en un balde.
- Cuenten cuántos peces lograron pescar.
- Pongan números o colores en los peces para sumar un reto extra.
aprendizaje: Introduce el magnetismo de forma lúdica y afina la coordinación ojo-mano y la paciencia.
  Contar y clasificar los peces suma aprendizaje.
variantes: Pongan distintos puntajes a los peces y sumen al final quién pescó más.
seguridad: Vigila los clips y el imán, que son pequeños; un adulto los maneja con los más chicos.
