orden: 36
edad: 3-5
tipo: naturaleza
titulo: Comedero de pájaros
gancho: Invitar a los pájaros del barrio con un comedero hecho en casa.
duracion: 20 min + observación
dif_prep: 2
dif_materiales: 1
materiales:
- Un tubo de cartón o una botella
- Mantequilla de maní o margarina
- Semillas o alpiste
- Hilo para colgar
preparacion: Reúne los materiales y elige un lugar tranquilo donde colgar el comedero, visible desde una
  ventana.
pasos:
- Unten el tubo o la botella con una capa de mantequilla de maní.
- Rueden el tubo sobre las semillas hasta que queden pegadas.
- Pasen un hilo para poder colgarlo.
- Cuélguenlo de una rama o reja a una altura segura.
- Observen con paciencia qué pájaros llegan a comer y cuáles son.
aprendizaje: Conecta a los niños con la fauna cercana y fomenta el cuidado de los animales. Observar y
  reconocer pájaros desarrolla la atención y el respeto por la naturaleza.
variantes: Lleven un registro dibujado de los pájaros que visitan el comedero cada día.
seguridad: Cuelguen el comedero en un lugar seguro y lávense las manos después de manipular semillas.
