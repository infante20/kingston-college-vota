orden: 21
edad: 0-2
tipo: recreativa
titulo: Plumas voladoras
gancho: Soplar para que una pluma flote es un juego que encanta y enseña a controlar el aire.
duracion: 10 min
dif_prep: 1
dif_materiales: 1
materiales:
- Plumas livianas o trocitos de papel de seda
- Una bandeja o mesa
preparacion: Reúne unas pocas plumas grandes y livianas sobre una bandeja, a la altura del bebé.
pasos:
- Sopla tú una pluma y deja que el bebé la vea flotar y caer.
- Sostén una pluma frente a su boca y anímalo a soplar.
- Celebra cada intento, aunque solo mueva el aire un poquito.
- Atrapen juntos las plumas que caen al suelo.
- Pónganle una pluma en la mano para que la deje caer desde lo alto.
aprendizaje: Ejercita el soplo, que fortalece los músculos de la boca usados al hablar y comer. Seguir
  la pluma con la vista mejora la atención y la coordinación.
variantes: Soplen las plumas a través de un tubo de cartón para dirigir mejor el aire.
seguridad: Vigila que no se lleve las plumas a la boca o la nariz; guárdalas al terminar.
