id: 3a5-17
orden: 17
edad: 3-5
tipo: sensorial
titulo: Mesa de exploración de sémola
gancho: Una bandeja llena de sémola para escarbar, enterrar y descubrir tesoros.
duracion: 20-30 min
dif_prep: 1
dif_materiales: 1
materiales:
- Una bandeja o caja baja
- Sémola, harina o arena fina
- Cucharas, vasos, embudos y juguetitos
- Un mantel para el suelo
preparacion: Vierte la sémola en la bandeja y reparte alrededor cucharas, vasos y objetos para esconder.
pasos:
- Pon un mantel en el suelo y la bandeja encima para contener el desorden.
- Esconde algunos juguetitos en la sémola para que los busque.
- Deja que escarbe, trasvase y haga montañas a su gusto.
- 'Acompaña nombrando texturas y acciones: «llenas», «vacías», «entierras».'
- Al terminar, invítalo a ayudar a recoger con una escobilla.
aprendizaje: Estimula el tacto y la motricidad fina al pellizcar, verter y cavar. El juego libre con material
  suelto favorece la concentración y la calma.
variantes: Cambien la sémola por arroz teñido de colores o por arena para variar la experiencia.
seguridad: Supervisa para que no se la lleve a la boca ni a los ojos; recoge lo que caiga al suelo.
