id: "6a8-09"
orden: 9
edad: "6-8"
tipo: emocional
titulo: "El frasco de la calma"
gancho: "Crea una galaxia de purpurina en un frasco para tranquilizarte cuando te enfadas."
duracion: "30-45 min"
dif_prep: 1
dif_materiales: 2
materiales:
  - "Un frasco o botella transparente con tapa que cierre bien"
  - "Agua tibia"
  - "Pegamento líquido transparente o con purpurina"
  - "Purpurina fina"
  - "Colorante de comida (opcional)"
  - "Cinta adhesiva fuerte para sellar la tapa"
preparacion: >
  Reúne los materiales sobre una mesa cubierta. Habla antes con el niño sobre las emociones
  fuertes: explicarle que a veces nos enfadamos o nos ponemos nerviosos prepara el sentido de
  esta actividad.
pasos:
  - "Llenad el frasco con agua tibia hasta tres cuartos de su capacidad."
  - "Añadid varias cucharadas de pegamento; cuanto más pegamento, más despacio caerá la purpurina."
  - "Echad la purpurina y, si queréis, una gota de colorante, y cerrad bien el frasco."
  - "Un adulto sella la tapa con cinta para que no se abra ni se derrame."
  - "Agitad el frasco y observad en silencio cómo la purpurina remolinea y baja poco a poco."
  - "Hablad de cómo, igual que la purpurina, los enfados se calman si esperamos respirando."
aprendizaje: >
  Ayuda a reconocer y gestionar emociones intensas. Mirar la purpurina asentarse acompaña la
  respiración lenta y enseña que las emociones, como la tormenta del frasco, pasan con el tiempo.
variantes: >
  Preparad varios frascos con colores asociados a distintas emociones, o usad el frasco como
  temporizador suave para una pausa de calma de un minuto.
seguridad: >
  Un adulto debe sellar la tapa con cuidado. Usa un frasco de plástico si hay riesgo de que se
  caiga y se rompa.
