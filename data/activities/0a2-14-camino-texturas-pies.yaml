id: 0a2-14
orden: 14
edad: 0-2
tipo: sensorial
titulo: Camino de texturas para los pies
gancho: Un recorrido para caminar descalzo y sentir el mundo con la planta de los pies.
duracion: 15 min
dif_prep: 2
dif_materiales: 1
materiales:
- Superficies de distintas texturas (toalla, alfombra, papel de burbujas, esponja, fieltro)
- Cinta adhesiva para fijarlas al suelo
preparacion: Coloca las distintas texturas en fila sobre el suelo y fíjalas con cinta para que no resbalen.
  Procura una zona despejada y segura.
pasos:
- Descalza al bebé y tómalo de las manos para darle seguridad.
- Ayúdalo a pisar la primera textura y observa su reacción.
- Avanza despacio de una superficie a otra, nombrando lo que siente.
- Si aún no camina, siéntalo y guía sus pies y manos sobre cada textura.
- Repitan el camino tantas veces como quiera, en los dos sentidos.
aprendizaje: Despierta la sensibilidad de los pies y mejora el equilibrio y la conciencia del cuerpo.
  Asociar sensaciones con palabras enriquece su vocabulario.
variantes: Termina el camino con un cojín mullido donde dejarse caer, o hazlo en el jardín con pasto y
  arena.
seguridad: Acompáñalo siempre tomado de la mano y revisa que las texturas no resbalen ni tengan bordes
  ásperos.
