id: "0a2-07"
orden: 7
edad: "0-2"
tipo: emocional
titulo: "Caras en el espejo"
gancho: "Frente al espejo, juntos, descubrimos sonrisas, muecas y el propio reflejo."
duracion: "5-10 min"
dif_prep: 1
dif_materiales: 1
materiales:
  - "Un espejo seguro (de pared o uno irrompible)"
preparacion: >
  Elige un espejo bien fijado a la pared o uno irrompible y sin bordes peligrosos. Sitúate
  con el bebé a una distancia cómoda en la que ambos se vean con claridad.
pasos:
  - "Sostén al bebé frente al espejo y deja que observe los reflejos."
  - "Señala y nombra: «ese es el bebé», «esa es mamá», tocando suavemente su reflejo."
  - "Haz caras de alegría, sorpresa o un beso, y observa cómo te imita o reacciona."
  - "Acompaña con palabras las emociones: «¡qué contento!», «¡qué sorpresa!»."
aprendizaje: >
  Favorece el reconocimiento de sí mismo, la conexión emocional y la imitación, base de la
  empatía y del aprendizaje social.
variantes: >
  Mueve un juguete por detrás del bebé para que aparezca en el espejo y descubra de dónde
  viene al girarse.
seguridad: >
  Revisa que el espejo esté bien sujeto y no pueda caer ni romperse. Evita espejos de
  vidrio al alcance del bebé sin supervisión.
imagen: "0a2-07.png"
