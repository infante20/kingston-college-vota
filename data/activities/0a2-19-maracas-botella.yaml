id: 0a2-19
orden: 19
edad: 0-2
tipo: recreativa
titulo: Maracas que suenan
gancho: Botellas con sorpresas dentro que suenan distinto al agitarlas.
duracion: 10-15 min
dif_prep: 2
dif_materiales: 1
materiales:
- Botellas de plástico pequeñas con tapa
- Rellenos sonoros (arroz, fideos, cascabeles, botones grandes)
- Pegamento fuerte o cinta para sellar las tapas
preparacion: Llena cada botella hasta un tercio con un material distinto y sella muy bien la tapa con
  pegamento y cinta. Prepara dos o tres maracas.
pasos:
- Agita tú una maraca marcando un ritmo sencillo.
- Dásela al bebé para que la sacuda a su manera.
- Cambien de maraca y comparen los distintos sonidos.
- Acompañen con una canción y muevan las maracas al compás.
- Hagan pausas de silencio y vuelvan a sonar para jugar con el contraste.
aprendizaje: Desarrolla el sentido del ritmo, el oído y la coordinación al agitar. Asociar movimiento
  y sonido es base del lenguaje y de la música.
variantes: Usa botellas transparentes para que además vea moverse el relleno de colores.
seguridad: 'Sella las tapas a la perfección: el contenido suelto es peligro de asfixia. Revísalas antes
  de cada uso.'
