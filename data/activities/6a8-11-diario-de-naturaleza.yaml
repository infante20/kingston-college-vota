id: "6a8-11"
orden: 11
edad: "6-8"
tipo: naturaleza
titulo: "Diario de exploradores de la naturaleza"
gancho: "Sal a la calle con lupa y cuaderno y conviértete en un explorador de la naturaleza."
duracion: "30-45 min"
dif_prep: 1
dif_materiales: 1
materiales:
  - "Un cuaderno o varias hojas grapadas"
  - "Lápiz y lápices de colores"
  - "Una lupa (opcional)"
  - "Una bolsa pequeña para recoger tesoros"
  - "Cinta adhesiva para pegar hallazgos"
preparacion: >
  Preparad el cuaderno escribiendo en la portada «Diario de explorador» y la fecha. Elegid un
  lugar cercano con plantas: un parque, el jardín o la acera con árboles. Vestíos para estar
  cómodos al aire libre.
pasos:
  - "Caminad despacio observando hojas, insectos, piedras y flores con calma."
  - "Usad la lupa para mirar de cerca las venas de una hoja o las patas de un bicho."
  - "Dibujad en el cuaderno tres cosas que os llamen la atención durante el paseo."
  - "Recoged hojas o flores caídas del suelo, sin arrancar nada de las plantas vivas."
  - "Pegad los hallazgos en el cuaderno y escribid al lado dónde y cuándo los encontrasteis."
  - "De vuelta a casa, contad cuántas especies distintas anotasteis."
aprendizaje: >
  Despierta la curiosidad científica y la observación detallada. Registrar y clasificar lo que
  ve, el niño aprende a fijarse, comparar y respetar la naturaleza.
variantes: >
  Repetid el paseo en distintas estaciones para comparar los cambios, o dedicad cada día una
  página a un único elemento, como solo hojas o solo piedras.
seguridad: >
  No toquéis plantas con espinas, setas ni animales desconocidos, y lavaos las manos al volver
  a casa.
