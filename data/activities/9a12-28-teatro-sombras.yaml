id: 9a12-28
orden: 28
edad: 9-12
tipo: arte
titulo: Teatro de sombras
gancho: Siluetas de cartón y una linterna para montar una función de sombras chinescas.
duracion: 40 min
dif_prep: 2
dif_materiales: 2
materiales:
- Cartón para las siluetas
- Palitos para sostenerlas
- Una sábana blanca o una pared clara
- Una linterna o lámpara
- Tijeras
preparacion: Cuelguen una sábana y ubiquen la linterna detrás. Decidan una historia y sus personajes.
pasos:
- Recorten en cartón las siluetas de los personajes.
- Peguen un palito a cada silueta para manejarla.
- Apaguen la luz y enciendan la linterna detrás de la sábana.
- Muevan las siluetas entre la luz y la tela para proyectar sombras.
- Representen la historia poniendo voces a cada personaje.
aprendizaje: Une arte, ciencia de la luz y expresión teatral en un solo proyecto. Inventar y representar
  una historia desarrolla el lenguaje y la creatividad.
variantes: Acerquen o alejen las siluetas de la luz para ver cómo crecen y encogen las sombras.
seguridad: Un adulto ayuda con los recortes y con el manejo de la lámpara para evitar el calor.
