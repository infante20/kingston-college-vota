id: "0a2-10"
orden: 10
edad: "0-2"
tipo: juego
titulo: "Torres que se caen"
gancho: "Apilar vasos o cajas para construir una torre y derribarla con un solo manotazo."
duracion: "10-15 min"
dif_prep: 1
dif_materiales: 1
materiales:
  - "Vasos de plástico, tápers o cajas pequeñas ligeras"
preparacion: >
  Reúne varios vasos o cajitas ligeras que se puedan apilar. Comprueba que no tengan bordes
  filosos ni piezas sueltas y que sean lo bastante grandes para no caber en la boca.
pasos:
  - "Sienta al bebé frente a ti, con los vasos entre los dos."
  - "Apila dos o tres vasos formando una torre y deja que él la mire."
  - "Anímalo a derribarla con la mano: «¡pum, se cayó!»."
  - "Vuelve a construir y deja que intente apilar o tirar él mismo, una y otra vez."
aprendizaje: >
  Trabaja la motricidad fina, la causa-efecto y la noción de equilibrio. Construir y derribar
  enseña paciencia y aporta diversión repetida.
variantes: >
  Cuando crezca, ofrécele vasos de distintos tamaños para que descubra cómo encajan unos
  dentro de otros.
seguridad: >
  Usa materiales ligeros e irrompibles para que, al caer, no le hagan daño. Evita piezas
  pequeñas y supervisa siempre.
imagen: "0a2-10.png"
