id: 3a5-35
orden: 35
edad: 3-5
tipo: naturaleza
titulo: Un poroto en algodón
gancho: Ver brotar y crecer una plantita día a día desde una semilla.
duracion: 15 min + cuidado diario
dif_prep: 1
dif_materiales: 1
materiales:
- Un frasco o vaso transparente
- Algodón
- Un poroto o lenteja seca
- Agua
preparacion: Humedece el algodón y colócalo dentro del frasco.
pasos:
- Pongan el poroto entre el algodón y el vidrio para poder verlo.
- Mantengan el algodón siempre húmedo, sin encharcar.
- Dejen el frasco en un lugar con luz.
- 'Observen cada día y dibujen los cambios: la raíz, el tallo, las hojas.'
- Cuando crezca, trasplántenlo a una maceta con tierra.
aprendizaje: Muestra el ciclo de vida de una planta y enseña responsabilidad al cuidarla. Observar y registrar
  los cambios introduce la observación científica.
variantes: Siembren varios porotos y comparen cuál crece más según la luz o el agua.
seguridad: Recuerda que la semilla se siembra, no se come; lávense las manos al terminar.
