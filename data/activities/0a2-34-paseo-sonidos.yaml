id: 0a2-34
orden: 34
edad: 0-2
tipo: naturaleza
titulo: Paseo de los sonidos
gancho: 'Salir a escuchar el mundo: pájaros, viento, autos y hojas.'
duracion: 15-20 min
dif_prep: 1
dif_materiales: 1
materiales:
- Un paseo al aire libre (patio, plaza o calle tranquila)
preparacion: Elige un momento del día tranquilo y un lugar al aire libre seguro. Abriga al bebé según
  el clima.
pasos:
- Carga o pasea al bebé por un lugar al aire libre, sin prisa.
- Detente de vez en cuando y guarda silencio para escuchar.
- 'Nombra los sonidos que aparecen: «un pajarito», «el viento», «un auto».'
- Imita algunos sonidos para que los relacione con su origen.
- Señala lo que produce cada sonido cuando sea posible verlo.
aprendizaje: Afina el oído y la atención, y conecta sonidos con sus causas. Pasear y nombrar el entorno
  enriquece el lenguaje y el asombro por la naturaleza.
variantes: Lleven a casa un sonido favorito imitándolo, o salgan a escuchar la lluvia bajo techo.
seguridad: Protégelo del sol y el frío y mantén siempre un entorno tranquilo y seguro.
