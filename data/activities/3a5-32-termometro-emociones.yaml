id: 3a5-32
orden: 32
edad: 3-5
tipo: emocional
titulo: El termómetro de las emociones
gancho: Una forma simpática de medir cómo nos sentimos y aprender a calmarnos.
duracion: 20 min
dif_prep: 2
dif_materiales: 1
materiales:
- Cartulina
- Plumones
- Un palito o flecha de cartón con un broche
preparacion: 'Dibuja un termómetro vertical con zonas de color: verde (tranquilo), amarillo (inquieto),
  rojo (muy enojado). Pon una flecha móvil.'
pasos:
- Conversen sobre cada zona y qué se siente en cada una.
- Pídele que mueva la flecha para mostrar cómo se siente ahora.
- Cuando esté en rojo, busquen juntos cómo bajar al verde.
- Practiquen respirar hondo o abrazarse para calmarse.
- Usen el termómetro otros días para hablar de emociones.
aprendizaje: Ayuda a reconocer y nombrar las emociones y a regularlas. Poner palabras a lo que se siente
  es la base de la inteligencia emocional.
variantes: Hagan un termómetro para cada miembro de la familia y compártanlo en la cena.
seguridad: Acepta todas las emociones sin juzgar; el objetivo es entenderlas, no esconderlas.
