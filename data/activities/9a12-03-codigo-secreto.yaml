id: "9a12-03"
orden: 3
edad: "9-12"
tipo: juego
titulo: "Mensajes en código secreto"
gancho: "Crea tu propio cifrado y envía mensajes que solo tu equipo podrá leer."
duracion: "45-60 min"
dif_prep: 1
dif_materiales: 1
materiales:
  - "Papel y lápiz"
  - "Regla"
  - "Cartón para construir un disco cifrador (opcional)"
  - "Un encuadernador o chincheta para el disco (opcional)"
  - "Tijeras (si haces el disco)"
preparacion: >
  Reúne a quienes vayan a jugar. Decidid quién será el equipo que envía mensajes y quién los
  descifra. Preparad papel y lápiz para todos.
pasos:
  - "Aprended el cifrado César: escribid el alfabeto y debajo, otro alfabeto desplazado un número fijo de letras (por ejemplo, 3). La A se convierte en D, la B en E, etc."
  - "Cada miembro escribe un mensaje corto y lo cifra letra por letra usando ese desplazamiento. Acordad el número clave en secreto."
  - "Intercambiad los mensajes cifrados y tratad de descifrarlos sin saber la clave: probad distintos desplazamientos hasta que tenga sentido."
  - "Inventad ahora vuestro propio código: podéis sustituir letras por símbolos, números o dibujos. Cread una tabla clave que solo conozca vuestro equipo."
  - "Si queréis, recortad dos círculos de cartón de distinto tamaño con el alfabeto en el borde y unidlos con un encuadernador para girar y cifrar más rápido."
  - "Organizad un reto final: esconded una pista cifrada en casa que lleve a un pequeño tesoro."
aprendizaje: >
  Introduce la criptografía y el pensamiento lógico. Cifrar y descifrar entrena el
  razonamiento, la atención al detalle y la idea de patrón y clave, base de la seguridad
  informática actual.
variantes: >
  Probad a cifrar escribiendo las palabras al revés, o usad una palabra clave que indique
  cuántas posiciones desplazar cada letra. Cronometrad quién descifra más rápido.
seguridad: >
  Si construyes el disco cifrador, usa las tijeras con cuidado al recortar el cartón.
