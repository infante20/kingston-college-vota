id: "9a12-03"
orden: 3
edad: "9-12"
tipo: juego
titulo: "Mensajes en código secreto"
gancho: "Crea tu propio cifrado y envía mensajes que solo tu equipo podrá leer."
duracion: "45-60 min"
dif_prep: 1
dif_materiales: 1
materiales:
  - "Papel y lápiz"
  - "Regla"
  - "Cartón para construir un disco cifrador (opcional)"
  - "Una mariposa de dos patas o chinche para el disco (opcional)"
  - "Tijeras (si haces el disco)"
preparacion: >
  Reúne a quienes vayan a jugar. Decidan quién será el equipo que envía mensajes y quién los
  descifra. Preparen papel y lápiz para todos.
pasos:
  - "Aprendan el cifrado César: escriban el alfabeto y debajo, otro alfabeto desplazado un número fijo de letras (por ejemplo, 3). La A se convierte en D, la B en E, etc."
  - "Cada miembro escribe un mensaje corto y lo cifra letra por letra usando ese desplazamiento. Acuerden el número clave en secreto."
  - "Intercambien los mensajes cifrados y traten de descifrarlos sin saber la clave: prueben distintos desplazamientos hasta que tenga sentido."
  - "Inventen ahora su propio código: pueden sustituir letras por símbolos, números o dibujos. Creen una tabla clave que solo conozca su equipo."
  - "Si quieren, recorten dos círculos de cartón de distinto tamaño con el alfabeto en el borde y únanlos con una mariposa de dos patas para girar y cifrar más rápido."
  - "Organicen un reto final: escondan una pista cifrada en casa que lleve a un pequeño tesoro."
aprendizaje: >
  Introduce la criptografía y el pensamiento lógico. Cifrar y descifrar entrena el
  razonamiento, la atención al detalle y la idea de patrón y clave, base de la seguridad
  informática actual.
variantes: >
  Prueben a cifrar escribiendo las palabras al revés, o usen una palabra clave que indique
  cuántas posiciones desplazar cada letra. Cronometren quién descifra más rápido.
seguridad: >
  Si construyes el disco cifrador, usa las tijeras con cuidado al recortar el cartón.
