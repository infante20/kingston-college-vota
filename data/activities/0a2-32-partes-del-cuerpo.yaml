id: 0a2-32
orden: 32
edad: 0-2
tipo: emocional
titulo: ¿Dónde está la nariz?
gancho: Un juego de cosquillas para descubrir y nombrar las partes del cuerpo.
duracion: 10 min
dif_prep: 1
dif_materiales: 1
materiales:
- Solo tus manos y tu voz
- Un espejo (opcional)
preparacion: Busca un momento de juego tranquilo, frente a frente.
pasos:
- Toca tu propia nariz y di «esta es la nariz».
- Toca con suavidad la nariz del bebé repitiendo la palabra.
- Sigue con ojos, boca, orejas, manos y pies, nombrando cada parte.
- Pregunta «¿dónde está la nariz?» y espera a que la busque o señale.
- Termina con cosquillas suaves en la pancita y muchas risas.
aprendizaje: 'Desarrolla el lenguaje y el esquema corporal: saber que su cuerpo tiene partes con nombre.
  El contacto cariñoso refuerza el vínculo y la autoimagen.'
variantes: Juéguenlo frente al espejo o sobre un muñeco para señalar las partes en otro cuerpo.
seguridad: Toca siempre con suavidad y respeta si no quiere que le toquen la cara ese día.
