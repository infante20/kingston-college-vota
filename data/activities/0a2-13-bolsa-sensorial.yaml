id: 0a2-13
orden: 13
edad: 0-2
tipo: sensorial
titulo: Bolsa sensorial sin manchas
gancho: Pintar y apretar colores con los dedos… sin ensuciarse ni una mano.
duracion: 10-15 min
dif_prep: 1
dif_materiales: 1
materiales:
- Una bolsa de congelar con cierre hermético
- Pintura de dedos, gel de baño con colorante o crema
- Cinta adhesiva fuerte
preparacion: Pon dos o tres cucharadas de pintura o gel de colores dentro de la bolsa, saca el aire y
  ciérrala. Refuerza el cierre con cinta y pégala sobre una mesa o el suelo.
pasos:
- Sienta al bebé frente a la bolsa pegada a la superficie.
- Apoya tú primero un dedo y presiona para mostrarle cómo se mueve el color.
- Deja que aplaste, arrastre y mezcle los colores apretando la bolsa.
- 'Nombra los colores y lo que ocurre: «mira cómo se junta el azul con el amarillo».'
- Cuando se canse, despega la bolsa y guárdala para otro día.
aprendizaje: Estimula el tacto y la vista sin riesgo de que se lleve la pintura a la boca. Apretar y arrastrar
  fortalece los músculos de las manos, base de la futura escritura.
variantes: Mete dentro purpurina, una hoja o un botón grande para que los empuje por la bolsa.
seguridad: Sella muy bien el cierre con cinta y no dejes nunca la bolsa al alcance sin supervisión.
