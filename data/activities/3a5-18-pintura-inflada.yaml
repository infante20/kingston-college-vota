id: 3a5-18
orden: 18
edad: 3-5
tipo: sensorial
titulo: Pintura que se infla
gancho: Una pintura esponjosa que queda en relieve, como nubes de colores.
duracion: 20 min
dif_prep: 2
dif_materiales: 2
materiales:
- Espuma de afeitar
- Pegamento blanco
- Colorante o témpera
- Cartón grueso
- Cucharas para mezclar
preparacion: Mezcla en partes iguales espuma de afeitar y pegamento, y reparte en bols con un color distinto
  cada uno.
pasos:
- Muéstrale la mezcla esponjosa y deja que la toque.
- Pinten sobre el cartón con cucharas, pinceles o los dedos.
- 'Hagan formas con relieve: nubes, helados, montañas.'
- Observen cómo la pintura queda inflada y blandita al secar.
- Dejen secar la obra unas horas para que mantenga el volumen.
aprendizaje: 'Combina arte y experiencia sensorial: la textura inflada es nueva y fascinante. Mezclar
  y crear desarrolla la creatividad y la coordinación.'
variantes: Agreguen purpurina a la mezcla o dibujen primero un contorno para rellenar.
seguridad: Vigila que no se lleve la espuma a la boca y protege la ropa con un delantal.
