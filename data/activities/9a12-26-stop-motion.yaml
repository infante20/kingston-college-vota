id: 9a12-26
orden: 26
edad: 9-12
tipo: arte
titulo: Película en stop motion
gancho: Mover figuras foto a foto para crear tu propia película animada.
duracion: 45-60 min
dif_prep: 2
dif_materiales: 2
materiales:
- Un celular o tablet con cámara
- Una app de stop motion gratuita
- Juguetes, plastilina o recortes
- Un soporte para apoyar la cámara fija
preparacion: Con ayuda, instalen una app sencilla de stop motion y elijan los personajes y un fondo.
pasos:
- Apoyen la cámara fija para que no se mueva entre fotos.
- Coloquen los personajes en su posición inicial y tomen una foto.
- Muevan un poquito los personajes y tomen otra foto.
- Repitan moviendo de a poco para crear el movimiento.
- Reproduzcan la secuencia y agreguen sonido o música.
aprendizaje: Combina arte, narración y tecnología, y enseña que el cine es ilusión de movimiento. Planear
  una historia cuadro a cuadro desarrolla la paciencia y la creatividad.
variantes: Hagan que un objeto aparezca o desaparezca, o que la plastilina se transforme.
seguridad: Acuerden tiempos de pantalla y supervisen el uso del dispositivo.
