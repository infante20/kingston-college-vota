id: 0a2-27
orden: 27
edad: 0-2
tipo: juego
titulo: Grandes y chicas
gancho: 'Separar pelotas grandes de pequeñas: el primer juego de clasificar.'
duracion: 10-15 min
dif_prep: 1
dif_materiales: 1
materiales:
- Pelotas u objetos blandos de dos tamaños bien distintos
- Dos canastas o recipientes
preparacion: Reúne objetos claramente grandes y claramente pequeños (pero no tanto como para ser riesgo)
  y coloca dos canastas.
pasos:
- Muéstrale una pelota grande y una chica, nombrando «grande» y «chica».
- Pon una de cada en su canasta para mostrar la idea.
- Dale las pelotas de una en una y anímalo a ponerlas donde van.
- 'Acompaña sin corregir de más: lo importante es que manipule y observe.'
- Al terminar, vacíen todo y vuelvan a empezar si quiere.
aprendizaje: Introduce la comparación de tamaños y la idea de agrupar, base del pensamiento lógico y matemático.
  Trasladar objetos ejercita la coordinación.
variantes: Clasifiquen por color en lugar de por tamaño cuando ya domine el juego.
seguridad: Asegúrate de que incluso los objetos «pequeños» no quepan enteros en la boca.
