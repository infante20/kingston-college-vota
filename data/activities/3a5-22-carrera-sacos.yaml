id: 3a5-22
orden: 22
edad: 3-5
tipo: recreativa
titulo: Carrera de sacos
gancho: 'Meterse en un saco y avanzar a saltos: risas aseguradas para toda la familia.'
duracion: 15-20 min
dif_prep: 1
dif_materiales: 1
materiales:
- Una funda de almohada o un saco por participante
- Un espacio amplio, mejor al aire libre
preparacion: Marquen una línea de salida y una meta a pocos metros. Repartan los sacos.
pasos:
- Cada uno se mete dentro de su saco y lo sujeta a la cintura.
- Se ubican todos en la línea de salida.
- A la cuenta de tres, avanzan dando saltitos hacia la meta.
- El primero en cruzar gana, pero lo importante es divertirse.
- Repitan la carrera o prueben en parejas tomados de la mano.
aprendizaje: Trabaja el equilibrio, la fuerza de las piernas y la coordinación al saltar. Competir con
  alegría enseña a ganar y perder con buen ánimo.
variantes: Hagan una carrera de relevos por equipos pasando el saco de uno a otro.
seguridad: Jueguen sobre pasto o una superficie blanda y acompañen a los más pequeños.
