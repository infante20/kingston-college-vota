id: "9a12-11"
orden: 11
edad: "9-12"
tipo: arte
titulo: "Flipbook: animación sin pantalla"
gancho: "Da vida a tus dibujos creando una película de bolsillo que se mueve al pasar las hojas."
duracion: "45-60 min"
dif_prep: 1
dif_materiales: 1
materiales:
  - "Un taco de notas adhesivas o muchas hojas pequeñas iguales"
  - "Lápiz y goma de borrar"
  - "Lápiz pasta negro"
  - "Una pinza o clip para sujetar las hojas"
  - "Tijeras (si cortas las hojas)"
preparacion: >
  Consigue un bloc grueso de hojas pequeñas iguales o recorta papel del mismo tamaño y
  sujétalo con una pinza por un lado. Piensa en un movimiento simple para animar.
pasos:
  - "Elige una animación sencilla: una pelota que bota, una flor que crece o una carita que sonríe poco a poco."
  - "Empieza por la última hoja del taco y dibuja el primer momento del movimiento, cerca del borde libre."
  - "En la hoja de encima, repite el dibujo cambiándolo solo un poquito. Usa la hoja anterior como guía mirándola al trasluz."
  - "Sigue hoja por hoja con cambios mínimos. Cuantos más dibujos hagas y menos varíe cada uno, más suave será la animación."
  - "Repasa todos los dibujos con lápiz pasta negro para que se vean bien y borra las marcas de lápiz."
  - "Sujeta el taco por un lado y pasa las hojas con el pulgar a buena velocidad. ¡Tus dibujos cobran vida! Ajusta lo que no fluya bien."
aprendizaje: >
  Demuestra cómo funciona la animación y la persistencia de la visión: muchas imágenes fijas
  que vistas rápido parecen movimiento. Exige planificación, constancia y atención al detalle
  fotograma a fotograma.
variantes: >
  Haz flipbooks más largos con historias completas, o une dos animaciones distintas. Prueben a
  intercambiarlos con amigos para adivinar qué movimiento dibujó cada uno.
seguridad: >
  Si cortas el papel para igualar las hojas, maneja las tijeras con cuidado.
