id: 3a5-29
orden: 29
edad: 3-5
tipo: arte
titulo: Collage de figuras
gancho: Círculos, cuadrados y triángulos de colores para construir lo que imaginen.
duracion: 20-30 min
dif_prep: 2
dif_materiales: 1
materiales:
- Papeles o cartulinas de colores
- Tijeras de punta redonda
- Pegamento
- Una hoja base
preparacion: Recorten muchas figuras geométricas de distintos tamaños y colores.
pasos:
- 'Repasen juntos los nombres de las figuras: círculo, cuadrado, triángulo.'
- 'Que imagine qué quiere armar: una casa, un robot, un animal.'
- Vaya pegando las figuras sobre la hoja para formar su creación.
- Conversen sobre los colores y las formas que va usando.
- Cuelguen la obra terminada en un lugar visible.
aprendizaje: Refuerza el reconocimiento de figuras y colores y la motricidad fina al pegar. Componer una
  imagen con formas desarrolla la creatividad y la planificación.
variantes: 'Propongan un reto: armar algo usando solo triángulos, o un patrón que se repita.'
seguridad: Usen tijeras de punta redonda y supervisen los recortes.
