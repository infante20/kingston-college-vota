id: 9a12-21
orden: 21
edad: 9-12
tipo: recreativa
titulo: Desafíos con la cuerda
gancho: Saltar la cuerda con rutinas y canciones para superar tus propias marcas.
duracion: 20-30 min
dif_prep: 1
dif_materiales: 1
materiales:
- Una cuerda para saltar
- Espacio amplio y despejado
- Música o canciones de salto (opcional)
preparacion: Busquen un espacio plano y sin obstáculos. Ajusten el largo de la cuerda a la estatura.
pasos:
- Calienten con saltos suaves sin cuerda.
- Practiquen el salto básico hasta encadenar varios seguidos.
- Cuenten cuántos saltos logran sin parar y anoten su marca.
- 'Sumen desafíos: salto cruzado, a un pie o a dúo.'
- Inventen rutinas con canciones y compitan de forma amistosa.
aprendizaje: Mejora la coordinación, el ritmo y la resistencia cardiovascular. Superar marcas propias
  enseña constancia y autosuperación.
variantes: Hagan saltos en grupo con una cuerda larga y dos personas girándola.
seguridad: Salten sobre una superficie plana y con calzado adecuado para cuidar las articulaciones.
