id: 0a2-33
orden: 33
edad: 0-2
tipo: emocional
titulo: La pelota va y viene
gancho: 'Rodar la pelota por turnos: el primer juego de compartir y esperar.'
duracion: 10 min
dif_prep: 1
dif_materiales: 1
materiales:
- Una pelota blanda de tamaño mediano
- Un suelo cómodo
preparacion: Siéntense en el suelo, uno frente al otro, con las piernas abiertas formando un canal.
pasos:
- Haz rodar la pelota despacio hacia el bebé diciendo «¡va!».
- Espera a que la detenga con las manos.
- 'Anímalo a devolvértela rodando: «ahora a mamá».'
- Celebra cada ida y vuelta con entusiasmo.
- Mantén el ritmo del turno para que entienda el «tú y yo».
aprendizaje: Introduce el juego por turnos, base de la comunicación y la futura conversación. Esperar
  su turno y devolver la pelota desarrolla la atención compartida.
variantes: Súmense más personas formando un círculo para rodar la pelota entre todos.
seguridad: Usa una pelota blanda y juega en un espacio despejado y cómodo.
