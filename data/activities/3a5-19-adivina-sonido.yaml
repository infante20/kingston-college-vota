id: 3a5-19
orden: 19
edad: 3-5
tipo: sensorial
titulo: Adivina el sonido
gancho: 'Frascos que suenan distinto según lo que esconden: ¿adivinas qué hay dentro?'
duracion: 15-20 min
dif_prep: 2
dif_materiales: 1
materiales:
- Frascos o envases opacos iguales
- Rellenos variados (arroz, porotos, monedas, agua, algodón)
- Cinta para sellar
preparacion: Prepara pares de frascos con el mismo relleno, ciérralos bien y mézclalos.
pasos:
- Agita un frasco y escuchen juntos el sonido que hace.
- Pídele que adivine qué hay dentro por cómo suena.
- Agiten otros frascos y comparen fuerte, suave, seco o líquido.
- Jueguen a encontrar las parejas que suenan igual.
- Abran los frascos al final para comprobar las respuestas.
aprendizaje: Afina la atención auditiva y la capacidad de comparar y deducir. Buscar parejas por el sonido
  entrena la memoria y la concentración.
variantes: Háganlo con instrumentos o con objetos de la casa escondidos tras una tela.
seguridad: Sella muy bien los frascos; supervisa los que contienen objetos pequeños.
