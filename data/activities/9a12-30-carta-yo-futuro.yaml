id: 9a12-30
orden: 30
edad: 9-12
tipo: emocional
titulo: Carta a mi yo del futuro
gancho: Escribir una carta para abrir dentro de un año y conversar con tu yo de hoy.
duracion: 30 min
dif_prep: 1
dif_materiales: 1
materiales:
- Papel y lápiz
- Un sobre
- Stickers o decoración (opcional)
preparacion: Busquen un momento tranquilo para pensar y escribir sin apuro.
pasos:
- 'Piensen cómo son hoy: lo que les gusta, sus amigos, sus sueños.'
- Escriban una carta dirigida a sí mismos dentro de un año.
- Incluyan metas, preguntas y un mensaje de ánimo.
- Guarden la carta en un sobre cerrado con la fecha de apertura.
- Anoten en el calendario cuándo abrirla y guárdenla en un lugar seguro.
aprendizaje: Favorece el autoconocimiento y la reflexión sobre los propios cambios y metas. Mirarse en
  el tiempo desarrolla la identidad y el sentido de progreso.
variantes: Hagan una versión familiar y ábranlas todos juntos en una fecha especial.
seguridad: 'Es un espacio íntimo: respeten que la carta es personal y privada.'
