id: 6a8-19
orden: 19
edad: 6-8
tipo: recreativa
titulo: Bádminton con globo
gancho: 'Raquetas de cartón y un globo: un partido lento y divertido para interiores.'
duracion: 20 min
dif_prep: 2
dif_materiales: 1
materiales:
- Platos o cartón para las raquetas
- Palitos de helado o reglas para los mangos
- Un globo
- Cinta
preparacion: Hagan raquetas pegando un palito a un plato o recorte de cartón. Inflen un globo.
pasos:
- Marquen una línea imaginaria o pongan una cuerda como red.
- Golpeen el globo con la raqueta para pasarlo al otro lado.
- El globo no puede tocar el suelo del propio campo.
- Cuenten los puntos cuando el globo cae en el campo contrario.
- Jueguen al mejor de varios puntos y cambien de lado.
aprendizaje: Mejora la coordinación ojo-mano y los reflejos con un objeto lento y seguro. Jugar por turnos
  y llevar el puntaje suma habilidades sociales y de cálculo.
variantes: 'Jueguen de forma cooperativa: cuenten cuántos golpes logran sin que el globo caiga.'
seguridad: Jueguen en un espacio despejado; recojan los globos rotos de inmediato por ser peligro de asfixia.
