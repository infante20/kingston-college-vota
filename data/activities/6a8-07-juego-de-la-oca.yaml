id: "6a8-07"
orden: 7
edad: "6-8"
tipo: juego
titulo: "Inventa tu juego de mesa"
gancho: "Dibuja un tablero con tus propias reglas y rétate a llegar el primero a la meta."
duracion: "30-45 min"
dif_prep: 1
dif_materiales: 1
materiales:
  - "Una cartulina o cartón grande"
  - "Lápices o plumones de colores"
  - "Un dado (o uno de papel hecho a mano)"
  - "Fichas: botones, tapones o monedas distintas"
  - "Papelitos para escribir pruebas y premios"
preparacion: >
  Siéntense juntos con la cartulina sobre la mesa. Acuerden el tema del juego antes de empezar:
  una selva, el espacio, un castillo. Esto ayudará a inventar las casillas con más ideas.
pasos:
  - "Dibujen un camino de casillas en zigzag desde una salida hasta una meta."
  - "Numeren las casillas y pinten algunas especiales: avanzar, retroceder o perder un turno."
  - "Escriban en papelitos retos divertidos para casillas concretas, como saltar tres veces."
  - "Cada jugador elige su ficha y la coloca en la salida."
  - "Por turnos, tiren el dado, avancen las casillas indicadas y cumplan lo que diga cada una."
  - "Gana quien llegue primero a la meta respetando todas las reglas inventadas."
aprendizaje: >
  Estimula la creatividad, la lectura de números y el pensamiento de causa y efecto al diseñar
  reglas justas. Jugar por turnos enseña a esperar, ganar y perder con deportividad.
variantes: >
  Creen cartas sorpresa que se roban al caer en ciertas casillas, o hagan dos caminos que se
  crucen para agregar trampas y atajos.
