id: 3a5-28
orden: 28
edad: 3-5
tipo: arte
titulo: Pintura soplada
gancho: Soplar gotas de pintura con una bombilla para crear ramas y monstruos locos.
duracion: 20 min
dif_prep: 1
dif_materiales: 2
materiales:
- Témpera líquida o aguada
- Una bombilla por persona
- Papel grueso
- Cucharas
preparacion: Diluye la témpera con un poco de agua para que sea soplable y protege la mesa.
pasos:
- Pon unas gotas de pintura líquida sobre el papel.
- Muéstrale cómo soplar con la bombilla para esparcir la gota.
- Que sople en distintas direcciones y vea aparecer ramas y formas.
- Combinen colores y observen cómo se mezclan al chocar.
- Cuando seque, busquen figuras escondidas en las manchas.
aprendizaje: Ejercita el soplo controlado, útil para el habla, y estimula la imaginación. Ver formas en
  las manchas desarrolla la creatividad y el lenguaje.
variantes: Agreguen ojos de papel a las manchas para convertirlas en criaturas divertidas.
seguridad: Recuerda soplar, nunca aspirar, por la bombilla; usa pinturas no tóxicas.
