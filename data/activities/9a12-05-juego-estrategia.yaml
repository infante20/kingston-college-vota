id: "9a12-05"
orden: 5
edad: "9-12"
tipo: juego
titulo: "Inventa tu juego de estrategia"
gancho: "Diseña desde cero un juego de mesa con tablero, reglas y fichas propias."
duracion: "45-60 min"
dif_prep: 1
dif_materiales: 2
materiales:
  - "Cartón o cartulina para el tablero"
  - "Regla y lápiz"
  - "Plumones"
  - "Tapas, monedas o botones como fichas"
  - "Un dado (o un dado de papel hecho a mano)"
  - "Papel para anotar las reglas"
preparacion: >
  Reúne los materiales sobre una mesa amplia. Decidan en familia cuántos jugadores tendrá el
  juego, eso influirá en el diseño del tablero.
pasos:
  - "Acuerden el objetivo del juego: llegar a una meta, conquistar casillas, acumular puntos o eliminar fichas rivales."
  - "Dibujen el tablero en el cartón: un recorrido de casillas, una cuadrícula o zonas a conquistar. Agreguen casillas especiales con efectos."
  - "Escriban las reglas en una hoja: cómo se mueve cada ficha, qué pasa en las casillas especiales y cómo se gana."
  - "Repartan las fichas y hagan una partida de prueba. Anoten qué normas no funcionan o resultan injustas."
  - "Ajusten las reglas tras probar: equilibren la suerte y la estrategia para que ganar dependa de pensar, no solo del dado."
  - "Jueguen la versión final y denle un nombre. Explíquensela a otra persona para comprobar que las reglas se entienden."
aprendizaje: >
  Fomenta el pensamiento estratégico, el diseño de sistemas y la negociación. Equilibrar las
  reglas enseña a probar, fallar y mejorar (iteración), y a escribir instrucciones claras
  para los demás.
variantes: >
  Agreguen cartas de evento que cambien el rumbo de la partida, o un modo cooperativo en el
  que todos jueguen contra el tablero. Creen una versión exprés de cinco minutos.
seguridad: >
  Si recortan el cartón para el tablero o las fichas, usen las tijeras con cuidado.
