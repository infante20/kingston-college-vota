id: 0a2-30
orden: 30
edad: 0-2
tipo: emocional
titulo: Masaje con canción
gancho: Caricias suaves y una canción tranquila para conectar y relajarse.
duracion: 10-15 min
dif_prep: 1
dif_materiales: 1
materiales:
- Una manta o toalla suave
- Aceite vegetal apto para bebés (opcional)
- Un ambiente cálido y tranquilo
preparacion: Elige un momento en que el bebé esté tranquilo, no recién comido. Calienta la habitación
  y ten todo a mano.
pasos:
- Recuesta al bebé boca arriba sobre la manta, sin ropa o con poca.
- Frota tus manos para entrarlas en calor y, si usas, ponte un poco de aceite.
- Acaricia con suavidad sus piernas, brazos y pancita con movimientos lentos.
- Acompaña cada caricia con una canción suave o con su nombre.
- 'Observa sus señales: si disfruta, continúa; si se incomoda, detente.'
aprendizaje: Refuerza el apego seguro y ayuda a regular las emociones y el sueño. El contacto piel con
  piel libera bienestar en el bebé y en quien lo cuida.
variantes: Convierte el masaje en parte de la rutina antes de dormir.
seguridad: Usa solo aceites aptos para bebés, evita la zona del cordón si es recién nacido y nunca masajees
  a la fuerza.
