id: "6a8-12"
orden: 12
edad: "6-8"
tipo: experimento
titulo: "El globo con electricidad mágica"
gancho: "Frota un globo en tu pelo y haz que mueva cosas sin tocarlas."
duracion: "30-45 min"
dif_prep: 1
dif_materiales: 1
materiales:
  - "Un globo inflado"
  - "Trocitos pequeños de papel"
  - "Un hilo fino o pelo"
  - "Un chorrito de agua del grifo"
  - "Una lata vacía de refresco"
preparacion: >
  Infla el globo y haz el nudo. Recorta papelitos muy pequeños y repártelos sobre la mesa. La
  experiencia funciona mejor en un día seco que en uno muy húmedo.
pasos:
  - "Frota el globo con fuerza contra tu pelo o un jersey de lana durante unos segundos."
  - "Acerca el globo a los papelitos sin tocarlos y observa cómo saltan hacia él."
  - "Vuelve a cargar el globo y acércalo a un hilo colgando para verlo moverse solo."
  - "Abre apenas el grifo formando un hilo fino de agua y acerca el globo cargado para curvar el chorro."
  - "Pon la lata tumbada en el suelo y acerca el globo despacio para hacerla rodar sin tocarla."
  - "Comentad qué objetos reaccionaron más y por qué se descarga el globo al tocar otras cosas."
aprendizaje: >
  Introduce la electricidad estática: al frotar el globo se carga y atrae objetos ligeros. El
  niño descubre una fuerza invisible y aprende a probar con distintos materiales.
variantes: >
  Probad a cargar dos globos y acercarlos para ver cómo se repelen, o intentad pegar el globo
  cargado a la pared.
seguridad: >
  Es electricidad estática inofensiva, pero recuerda no acercar el globo a los ojos y mantener
  el agua lejos de enchufes.
