id: 3a5-30
orden: 30
edad: 3-5
tipo: arte
titulo: Marioneta de calcetín
gancho: Un calcetín viejo se transforma en un personaje parlanchín con personalidad.
duracion: 25-30 min
dif_prep: 1
dif_materiales: 2
materiales:
- Un calcetín limpio
- Botones o trozos de fieltro para ojos
- Lana para el pelo
- Pegamento fuerte o aguja e hilo
preparacion: Reúne los materiales y decide con el niño qué personaje crearán.
pasos:
- Pónganse el calcetín en la mano para ver dónde va la boca.
- Peguen o cosan los ojos sobre el empeine del calcetín.
- Agreguen pelo de lana, orejas o lengua según el personaje.
- Déjenlo secar si usaron pegamento.
- Den vida a la marioneta con voz propia y monten una pequeña función.
aprendizaje: Fomenta la creatividad, el lenguaje y la expresión al inventar un personaje. Manipular la
  marioneta desarrolla la motricidad y la confianza para hablar.
variantes: Creen varias marionetas y armen una conversación o una historia entre ellas.
seguridad: Un adulto maneja la aguja si cosen; con los más pequeños, mejor pegar botones grandes.
