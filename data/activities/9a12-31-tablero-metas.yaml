id: 9a12-31
orden: 31
edad: 9-12
tipo: emocional
titulo: Tablero de sueños
gancho: Un collage de imágenes y palabras que reúne tus metas y lo que te inspira.
duracion: 40 min
dif_prep: 1
dif_materiales: 1
materiales:
- Una cartulina grande
- Revistas, fotos o dibujos
- Tijeras y pegamento
- Plumones
preparacion: Reúnan revistas y materiales para recortar y conversen sobre sueños y metas.
pasos:
- 'Piensen en metas para distintas áreas: aprender, crear, ayudar, disfrutar.'
- Busquen o dibujen imágenes y palabras que las representen.
- Recórtenlas y organícenlas sobre la cartulina.
- Péguenlas formando un collage que les inspire.
- Cuelguen el tablero en un lugar visible y revísenlo cada cierto tiempo.
aprendizaje: Ayuda a imaginar el futuro y a poner en palabras los propios deseos y metas. Visualizar objetivos
  fomenta la motivación y la autoestima.
variantes: Actualicen el tablero al cumplir metas o al descubrir nuevos intereses.
seguridad: 'Recuerden que las metas son personales: no se comparan ni se compiten.'
