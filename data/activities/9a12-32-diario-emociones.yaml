id: 9a12-32
orden: 32
edad: 9-12
tipo: emocional
titulo: Bitácora de emociones
gancho: Un cuaderno para registrar cómo te sientes y entender mejor lo que te pasa.
duracion: 10-15 min al día
dif_prep: 1
dif_materiales: 1
materiales:
- Un cuaderno
- Lápices de colores
- Una escala o lista de emociones de referencia
preparacion: Decoren la libreta y acuerden un momento del día para escribir, sin presiones.
pasos:
- Cada día, identifiquen la emoción principal que sintieron.
- Anoten qué la provocó y cómo reaccionaron.
- Dibujen o pongan color a esa emoción si quieren.
- Reflexionen sobre qué les ayudaría la próxima vez.
- Cada cierto tiempo, lean atrás y busquen patrones.
aprendizaje: Desarrolla la inteligencia emocional al nombrar, registrar y comprender lo que se siente.
  Escribir sobre las emociones ayuda a regularlas y a conocerse mejor.
variantes: Agreguen una sección de gratitud o de logros del día.
seguridad: Es un espacio privado y libre de juicio; acompañen sin obligar a compartir.
