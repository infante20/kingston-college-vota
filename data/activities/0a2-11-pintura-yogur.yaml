id: "0a2-11"
orden: 11
edad: "0-2"
tipo: arte
titulo: "Pintura de yogur"
gancho: "Pintar con los dedos usando yogur de colores, una obra de arte que se puede chupar sin peligro."
duracion: "10-15 min"
dif_prep: 2
dif_materiales: 2
materiales:
  - "Yogur natural"
  - "Un poco de colorante alimentario o puré de fruta para dar color"
  - "Papel grueso o una bandeja"
  - "Una toalla o babero grande"
preparacion: >
  Reparte el yogur en pequeños cuencos y tíñelo con un poco de colorante alimentario o puré
  de frutas. Cubre la mesa o el suelo, viste al bebé con ropa que se pueda manchar y ten una
  toalla a mano.
pasos:
  - "Sienta al bebé frente al papel o la bandeja con los cuencos de yogur de colores."
  - "Moja tú primero un dedo y haz una marca para mostrarle la idea."
  - "Deja que toque, embadurne y mezcle los colores con las manos libremente."
  - "Acompaña sin corregir: el objetivo es explorar, no hacer un dibujo bonito."
aprendizaje: >
  Estimula el tacto, la creatividad y la coordinación. Al ser comestible, permite explorar
  con todos los sentidos sin preocupaciones.
variantes: >
  Usa dos o tres colores y deja que descubra qué pasa al mezclarlos. También puedes pintar
  sobre la bandeja de la trona.
seguridad: >
  Usa solo ingredientes comestibles y colorantes alimentarios, pues todo acabará en su boca.
  Comprueba que no haya alergias al yogur y supervisa siempre.
