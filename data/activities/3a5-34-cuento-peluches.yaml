id: 3a5-34
orden: 34
edad: 3-5
tipo: emocional
titulo: Un cuento con peluches
gancho: Dar voz a los peluches para hablar de lo que sentimos jugando.
duracion: 20 min
dif_prep: 1
dif_materiales: 1
materiales:
- Peluches o muñecos
- Un espacio cómodo
preparacion: Elijan un par de peluches y siéntense juntos en un lugar tranquilo.
pasos:
- 'Inventen una historia simple donde un peluche siente algo: miedo, pena o alegría.'
- Hagan hablar a los peluches dándoles voz.
- Pregunten al niño cómo podría ayudar el peluche a sentirse mejor.
- Dejen que él dirija parte de la historia y proponga soluciones.
- Cierren con un final cariñoso y un abrazo de los peluches.
aprendizaje: A través del juego simbólico, el niño explora y nombra emociones a distancia segura. Buscar
  soluciones para el peluche desarrolla la empatía.
variantes: Usen los peluches para ensayar situaciones reales, como el primer día de jardín.
seguridad: Sigue el ritmo del niño y no fuerces temas que no quiera tocar ese día.
