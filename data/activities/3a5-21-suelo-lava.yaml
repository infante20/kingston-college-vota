id: 3a5-21
orden: 21
edad: 3-5
tipo: recreativa
titulo: El suelo es lava
gancho: ¡Cuidado! El piso es lava y solo los cojines te salvan de caer.
duracion: 15-20 min
dif_prep: 2
dif_materiales: 1
materiales:
- Cojines, almohadas, hojas de diario o trozos de cartón
- Un espacio amplio y despejado
preparacion: Repartan los cojines por el suelo como islas seguras, separados entre sí.
pasos:
- Declaren que el suelo es lava y solo los cojines son seguros.
- Crucen la habitación saltando de cojín en cojín sin tocar el piso.
- Si alguien pisa la «lava», vuelve al inicio entre risas.
- Cambien las islas de lugar para crear recorridos nuevos.
- Suban el desafío separando un poco más los cojines.
aprendizaje: Mejora el equilibrio, el salto y la planificación de movimientos. Imaginar un mundo de lava
  potencia el juego simbólico y la diversión en familia.
variantes: 'Agreguen reglas: cargar un peluche al cruzar o avanzar de espaldas.'
seguridad: Asegura que los cojines no resbalen y despeja muebles con esquinas duras.
