name: Generar imágenes (Together FLUX)

# Genera las ilustraciones del libro con la API de Together (FLUX) DESDE un
# runner de GitHub (que sí tiene internet) y las commitea de vuelta a la rama.
# Requiere el secreto de repositorio TOGETHER_API_KEY.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerar TODAS las imágenes (aunque ya existan)"
        type: boolean
        default: false
  push:
    branches: ["claude/kdp-screentime-activities-ebook-TNDdN"]
    paths:
      - "data/activities/**"
      - "scripts/gen_images_together.py"
      - "scripts/prompts.py"
      - ".github/workflows/generate-images.yml"

permissions:
  contents: write

concurrency:
  group: gen-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    # Evita bucles: no re-dispara con el commit del propio bot.
    if: ${{ !contains(github.event.head_commit.message, '[img-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar secreto TOGETHER_API_KEY
        id: chk
        env:
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: |
          if [ -z "${TOGETHER_API_KEY}" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Falta el secreto TOGETHER_API_KEY. Agrégalo en Settings -> Secrets and variables -> Actions y vuelve a ejecutar este workflow."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar dependencias
        if: steps.chk.outputs.has_key == 'true'
        run: pip install --quiet pyyaml

      - name: Generar imágenes con FLUX
        if: steps.chk.outputs.has_key == 'true'
        env:
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: |
          python scripts/gen_images_together.py \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }} \
            --delay 0.5

      - name: Commitear imágenes generadas
        if: steps.chk.outputs.has_key == 'true'
        run: |
          if [ -n "$(git status --porcelain assets/images)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/images
            git commit -m "Generar imágenes del libro con Together FLUX [img-bot]"
            git push origin "HEAD:${{ github.ref_name }}"
            echo "Imágenes commiteadas."
          else
            echo "Sin cambios en assets/images (¿ya existían todas?)."
          fi
